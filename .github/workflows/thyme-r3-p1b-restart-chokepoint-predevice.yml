name: thyme-r3-p1b-restart-chokepoint-predevice

# MAINLINE_V2_R3_P1B_RESTART_CHOKEPOINT_PREDEVICE_READINESS_CI
# SOURCE AUDIT + PUBLIC GHA PAIR CONSTRUCTION + PAIR IDENTITY / SAFETY.
# No private pack, no device-ready boot, no *.img, no
# READY_FOR_*_DEVICE_CONTROL.
# Deliverables:
#   source-audit   machine_restart source/map-timing/doc/workflow gate
#   reset-pair-build  authoritative vmlinux rebuild, identity/landing/
#                  coverage/rewrite audit, FIX8-anchored RESET8+RESET1
#                  INLINE pair, delay-only pair diff, negative fixtures
#   verify         independent structural re-verification
on:
  push:
    branches: [route-b-v3, route-b-v3-panic-entry-integration]
    paths:
      - '.github/workflows/thyme-r3-p1b-restart-chokepoint-predevice.yml'
      - 'scripts/r3-p1b/p1b-reset-device.S'
      - 'scripts/r3-p1b/p1b-reset-device.ld'
      - 'scripts/r3-p1b/p1b-restart-chokepoint-predevice.py'
      - 'scripts/r3-p1b/restart-chokepoint-pair-design.schema.json'
      - 'scripts/r3-p1b/p1b-build.py'
      - 'scripts/r3-p1b/p1b-trampoline.S'
      - 'scripts/r3-p1b/p1b-trampoline.ld'
      - 'early/alternative-reset-source-map.json'
      - 'docs/route-r3-p1b-restart-chokepoint-predevice-readiness.md'
  pull_request:
    paths:
      - '.github/workflows/thyme-r3-p1b-restart-chokepoint-predevice.yml'
      - 'scripts/r3-p1b/p1b-reset-device.S'
      - 'scripts/r3-p1b/p1b-reset-device.ld'
      - 'scripts/r3-p1b/p1b-restart-chokepoint-predevice.py'
      - 'scripts/r3-p1b/restart-chokepoint-pair-design.schema.json'
      - 'docs/route-r3-p1b-restart-chokepoint-predevice-readiness.md'
  workflow_dispatch:
    inputs:
      rt_d_run_id:
        description: Public GHA run id carrying artifact thyme-r3-runtime-dtb
        required: false
        default: "34678001413"
      fix8_run_id:
        description: Public GHA run id carrying artifact thyme-r3-p1b-fix8-fix24
        required: false
        default: "34741153230"

concurrency:
  group: thyme-r3-p1b-restart-chokepoint-predevice-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  source-audit:
    name: R3 P1B restart-chokepoint source gate
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Checkout project
        uses: actions/checkout@v4

      - name: Fetch pinned linux-6.6
        run: |
          set -euo pipefail
          git submodule update --init --depth 1 linux-6.6
          base=$(git -C linux-6.6 rev-parse HEAD)
          echo "LINUX_BASE_COMMIT=$base"
          test "$base" = 8b73de7da85fde281a385e0b26eda9bffd3ca477

      - name: Lint workflow in Actions
        uses: docker://rhysd/actionlint:latest
        with:
          args: -color .github/workflows/thyme-r3-p1b-restart-chokepoint-predevice.yml

      - name: Parse scripts
        run: |
          python3 -m py_compile scripts/r3-p1b/p1b-restart-chokepoint-predevice.py
          python3 -m py_compile scripts/r3-p1b/p1b-build.py

      - name: Restart-chokepoint source-gate
        env:
          GITHUB_ACTIONS: "true"
        run: |
          set -o pipefail
          python3 scripts/r3-p1b/p1b-restart-chokepoint-predevice.py \
            --mode source-gate | tee reset-source-gate.txt
          for k in \
            'RESET_SOURCE_GATE=PASS' \
            'RESET_SOURCE_AUDIT=PASS' \
            'CAN_CAUSE_RESET=SOURCE_PROVEN' \
            'CAN_BE_REACHED_AFTER_C_DELAY=SOURCE_SUPPORTED' \
            'CAN_EXPLAIN_23_28S_TIMING=UNKNOWN' \
            'RESET_PAIR_PRIMARY_TARGET=machine_restart' \
            'LOCAL_BUILD=NO' \
            'DEVICE_OPERATION=NO' \
            'PRIVATE_PACK_RUN=NONE' \
            'READY_FOR_DEVICE=NO' \
            'SLOT_A_WRITTEN=NO' ; do
            grep -Fxq "$k" reset-source-gate.txt
          done

      - name: Assert constraints
        shell: bash
        run: |
          set -euo pipefail
          if git ls-files | grep -Ei '(^|/)(r3-p1b|p1b).*\.(img)$'; then
            echo 'tracked p1b device image found' >&2
            exit 1
          fi
          echo 'LOCAL_BUILD=NO'
          echo 'GHA_ONLY=YES'
          echo 'DEVICE_OPERATION=NO'
          echo 'PARTITION_WRITES=0'
          echo 'SLOT_A_WRITTEN=NO'
          echo 'PRIVATE_PACK_RUN=NONE'
          echo 'READY_FOR_DEVICE=NO'

      - name: Upload source-gate
        uses: actions/upload-artifact@v4
        with:
          name: thyme-r3-p1b-reset-source-audit
          if-no-files-found: error
          path: reset-source-gate.txt

  reset-pair-build:
    name: R3 P1B RESET8/RESET1 inline pair build + identity/diff gates
    runs-on: ubuntu-24.04
    timeout-minutes: 150
    needs: [source-audit]
    steps:
      - name: Checkout project
        uses: actions/checkout@v4

      - name: Install pinned LLVM 18.1.3 toolchain
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo apt-get install -y \
            clang lld llvm make gcc bc bison flex libssl-dev libelf-dev \
            cpio file python3 gcc-aarch64-linux-gnu \
            binutils-aarch64-linux-gnu
          clang --version | head -1 | tee clang-version.txt
          grep -F '18.1.3' clang-version.txt
          echo "TOOLCHAIN_PINNED=$(clang --version | head -1)"

      - name: Fetch pinned linux-6.6
        run: |
          set -euo pipefail
          git submodule update --init --depth 1 linux-6.6
          test "$(git -C linux-6.6 rev-parse HEAD)" = \
            8b73de7da85fde281a385e0b26eda9bffd3ca477

      - name: Download frozen RT-D / FIX8 from public GHA
        env:
          GH_TOKEN: ${{ github.token }}
          RT_D_RUN_ID: ${{ inputs.rt_d_run_id || '34678001413' }}
          FIX8_RUN_ID: ${{ inputs.fix8_run_id || '34741153230' }}
        run: |
          set -euo pipefail
          gh run download "$RT_D_RUN_ID" \
            --repo "${{ github.repository }}" \
            --name thyme-r3-runtime-dtb --dir rt-d
          printf '%s  rt-d/rt-d.dtb\n' \
            4849743205af9d00f4b5bcd01070aac68be7dc60954975069356d29fe33df327 \
            | sha256sum -c -
          gh run download "$FIX8_RUN_ID" \
            --repo "${{ github.repository }}" \
            --name thyme-r3-p1b-fix8-fix24 --dir fix8
          printf '%s  fix8/thyme-r3-p1b-fix8-kernel-payload.bin\n' \
            4f34eabf670a735b3a10ebd0fb005e937faba881ea23fdc0843cf4ac96cceb41 \
            | sha256sum -c -
          echo 'FIX8_PAYLOAD_BASE=PUBLIC_GHA_RUN_34741153230'
          echo 'RT_D_SOURCE=PUBLIC_GHA_RUN_34678001413'

      - name: Build RESET8/RESET1 pair + run all gates
        env:
          GITHUB_ACTIONS: "true"
        run: |
          set -o pipefail
          mkdir -p out-reset
          python3 scripts/r3-p1b/p1b-restart-chokepoint-predevice.py \
            --mode reset-pair --out out-reset --jobs "$(nproc)" \
            --rt-d rt-d/rt-d.dtb \
            --fix8-payload fix8/thyme-r3-p1b-fix8-kernel-payload.bin \
            | tee out-reset-run.txt
          G=out-reset/p1b-reset-gates.txt
          grep -Fxq 'RESET_PAIR_BUILD_GATES=PASS' "$G"
          grep -Fxq 'RESET_PAIR_BASELINE=FROZEN_FIX8' "$G"
          grep -Fxq 'MACHINE_RESTART_SYMBOL_REDERIVED=YES' "$G"
          grep -Fxq 'MACHINE_RESTART_ENTRY_AUDIT=PASS' "$G"
          grep -Fxq 'RESTART_CHOKE_PROBE_ARCHITECTURE=INLINE' "$G"
          grep -Fxq 'RESTART_CHOKE_INLINE_SAFE=YES' "$G"
          grep -Fxq 'RESTART_CHOKEPOINT_SELECTED=machine_restart' "$G"
          grep -Fxq 'RESET_PAIR_DIFF_ATTRIBUTED=DELAY_CONSTANT_ONLY' "$G"
          grep -Fxq 'RESET_PAIR_DIAGNOSTIC_CORE_MATCHES_PROVEN_CORE=YES' "$G"
          grep -Fxq 'RESET_PAIR_ALL_PRIOR_PROBES_REMOVED=YES' "$G"
          grep -Fxq 'RESET8_VS_FIX8_ATTRIBUTION=RESTART_CHOKE_CHECKPOINT_ONLY' "$G"
          grep -Fxq 'RESET1_VS_FIX8_ATTRIBUTION=RESTART_CHOKE_CHECKPOINT_ONLY' "$G"
          grep -Fxq 'RESET_PAIR_INIT_IDENTICAL=YES' "$G"
          grep -Fxq 'RESET_PAIR_EXPECTED_DELTA=-7.000' "$G"
          grep -Fxq 'CAN_EXPLAIN_23_28S_TIMING=UNKNOWN' "$G"
          grep -Fxq 'CAN_CAUSE_RESET=SOURCE_PROVEN' "$G"
          grep -Fxq 'RESET_NEGATIVE_FIXTURES=PASS' "$G"
          grep -Fxq 'RESET_PAIR_STATUS=NOT_DEVICE_READY' "$G"
          grep -Fxq 'READY_FOR_DEVICE=NO' "$G"
          grep -Fxq 'PRIVATE_PACK_RUN=NONE' "$G"
          grep -Fxq 'DEVICE_OPERATION=NO' "$G"
          grep -Fxq 'RESET_DIAGNOSTIC_ONLY=YES' "$G"
          grep -Fxq 'RESET_NORMAL_KERNEL_BOOT_CANDIDATE=NO' "$G"
          grep -Fxq 'RESET_PAIR_AUDIT=PASS' out-reset/p1b-reset-pair-audit.txt
          grep -Eq '^RESET8_PAYLOAD_SHA=[0-9a-f]{64}$' out-reset-run.txt
          grep -Eq '^RESET1_PAYLOAD_SHA=[0-9a-f]{64}$' out-reset-run.txt
          grep -Fxq 'RESET_PAIR_DIFF_BYTE_COUNT=2' out-reset-run.txt
          grep -Fxq 'MACHINE_RESTART_ENTRY0=paciasp' out-reset-run.txt
          grep -Fxq 'RESET_PAIR_INIT_IDENTICAL=YES' out-reset-run.txt
          test -s out-reset/thyme-r3-p1b-reset8-kernel-payload.bin
          test -s out-reset/thyme-r3-p1b-reset1-kernel-payload.bin
          test -s out-reset/restart-chokepoint-pair-design.json

      - name: Assert no device image was emitted
        shell: bash
        run: |
          set -euo pipefail
          if find . -name '*.img' -print -quit | grep -q .; then
            echo 'device image emitted' >&2
            exit 1
          fi
          echo 'PUBLIC_R3_P1B_RESET_PAIR_NO_DEVICE_IMAGE=PASS'
          echo 'PRIVATE_PACK_RUN=NONE'
          echo 'DEVICE_OPERATION=NO'
          echo 'SLOT_A_WRITTEN=NO'

      - name: Stage RESET pair release inputs
        run: |
          mkdir -p out-reset-release
          cp out-reset/thyme-r3-p1b-reset8-kernel-payload.bin out-reset-release/
          cp out-reset/thyme-r3-p1b-reset1-kernel-payload.bin out-reset-release/
          cp out-reset/p1b-reset8-checkpoint.bin out-reset-release/
          cp out-reset/p1b-reset1-checkpoint.bin out-reset-release/
          cp out-reset/p1b-t1-core-reference.bin out-reset-release/
          cp out-reset/p1b-reset-manifest.json out-reset-release/
          cp out-reset/p1b-reset-gates.txt out-reset-release/
          cp out-reset/p1b-reset-pair-audit.txt out-reset-release/
          cp out-reset/restart-chokepoint-pair-design.json out-reset-release/
          cp out-reset/early/restart-chokepoint-pair-design.json \
            out-reset-release/early-restart-chokepoint-pair-design.json
          for f in p1b-reset-negative-fixtures.txt \
                   p1b-reset-machine_restart-disasm.txt \
                   p1b-reset-do_kernel_restart-disasm.txt \
                   p1b-reset8-core-disasm.txt \
                   p1b-reset1-core-disasm.txt \
                   p1b-reset-original-covered-insns-record-disasm.txt; do
            if test -e "out-reset/$f"; then
              cp "out-reset/$f" out-reset-release/
            fi
          done
          cp out-reset-run.txt out-reset-release/
          ( cd out-reset-release && sha256sum \
              thyme-r3-p1b-reset8-kernel-payload.bin \
              thyme-r3-p1b-reset1-kernel-payload.bin \
              p1b-reset8-checkpoint.bin \
              p1b-reset1-checkpoint.bin \
              p1b-t1-core-reference.bin \
              > SHA256SUMS )
          cat out-reset-release/SHA256SUMS

      - name: Upload RESET pair artifacts
        uses: actions/upload-artifact@v4
        with:
          name: thyme-r3-p1b-reset-pair
          if-no-files-found: error
          path: out-reset-release/**

  verify:
    name: R3 P1B RESET pair independent re-verification
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    needs: reset-pair-build
    steps:
      - name: Download this run artifacts
        env:
          GH_TOKEN: ${{ github.token }}
          RUN_ID: ${{ github.run_id }}
        run: |
          set -euo pipefail
          gh run download "$RUN_ID" \
            --repo "${{ github.repository }}" \
            --name thyme-r3-p1b-reset-pair --dir art
          ( cd art && sha256sum -c SHA256SUMS )
          echo 'ARTIFACT_SHA_RECHECK=PASS'

      - name: Download frozen FIX8 + RT-D again
        env:
          GH_TOKEN: ${{ github.token }}
          FIX8_RUN_ID: ${{ inputs.fix8_run_id || '34741153230' }}
          RT_D_RUN_ID: ${{ inputs.rt_d_run_id || '34678001413' }}
        run: |
          set -euo pipefail
          gh run download "$FIX8_RUN_ID" \
            --repo "${{ github.repository }}" \
            --name thyme-r3-p1b-fix8-fix24 --dir fix8
          printf '%s  fix8/thyme-r3-p1b-fix8-kernel-payload.bin\n' \
            4f34eabf670a735b3a10ebd0fb005e937faba881ea23fdc0843cf4ac96cceb41 \
            | sha256sum -c -
          gh run download "$RT_D_RUN_ID" \
            --repo "${{ github.repository }}" \
            --name thyme-r3-runtime-dtb --dir rt-d
          printf '%s  rt-d/rt-d.dtb\n' \
            4849743205af9d00f4b5bcd01070aac68be7dc60954975069356d29fe33df327 \
            | sha256sum -c -

      - name: Independent structured re-verification
        env:
          GITHUB_ACTIONS: "true"
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import hashlib, json, struct
          from pathlib import Path

          def sha(b): return hashlib.sha256(b).hexdigest()
          def sx(v, bits):
              m = 1 << bits
              return v - m if v & (m >> 1) else v
          def align(v, a): return (v + a - 1) // a * a

          r8 = Path("art/thyme-r3-p1b-reset8-kernel-payload.bin").read_bytes()
          r1 = Path("art/thyme-r3-p1b-reset1-kernel-payload.bin").read_bytes()
          fix8 = Path("fix8/thyme-r3-p1b-fix8-kernel-payload.bin").read_bytes()
          rtd = Path("rt-d/rt-d.dtb").read_bytes()
          ck8 = Path("art/p1b-reset8-checkpoint.bin").read_bytes()
          ck1 = Path("art/p1b-reset1-checkpoint.bin").read_bytes()
          t1core = Path("art/p1b-t1-core-reference.bin").read_bytes()
          m = json.loads(Path("art/p1b-reset-manifest.json").read_text())
          d = json.loads(Path("art/restart-chokepoint-pair-design.json").read_text())

          PACIASP = 0xD503233F
          W_DELAY_8S = 0xD280010A
          W_DELAY_1S = 0xD280002A
          if sha(r8) != m["reset8_payload_sha256"]:
              raise SystemExit("RESET_VERIFY_FAILED RESET8 sha vs manifest")
          if sha(r1) != m["reset1_payload_sha256"]:
              raise SystemExit("RESET_VERIFY_FAILED RESET1 sha vs manifest")
          if len(r8) != 37369041 or len(r1) != len(r8) or len(fix8) != len(r8):
              raise SystemExit(f"RESET_VERIFY_FAILED size {len(r8)} {len(r1)}")
          if sha(ck8) != m["reset8_checkpoint_sha256"]:
              raise SystemExit("RESET_VERIFY_FAILED ck8 sha")
          if sha(ck1) != m["reset1_checkpoint_sha256"]:
              raise SystemExit("RESET_VERIFY_FAILED ck1 sha")
          plen = int(m["checkpoint_size"])
          if plen != 80 or len(ck8) != 80 or len(ck1) != 80:
              raise SystemExit(f"RESET_VERIFY_FAILED checkpoint size {plen}")
          if len(t1core) != 76:
              raise SystemExit("RESET_VERIFY_FAILED t1 core size")
          if m["selected_target"] != "machine_restart":
              raise SystemExit("RESET_VERIFY_FAILED selected target")
          if m.get("fallback_selected") != "NO":
              raise SystemExit("RESET_VERIFY_FAILED fallback selected")
          if abs(float(m["expected_delta_s"]) + 7.0) > 1e-9:
              raise SystemExit("RESET_VERIFY_FAILED expected delta")
          if d["private_pack"] is not False or d["device_ready"] is not False:
              raise SystemExit("RESET_VERIFY_FAILED private/device flags")
          if d["can_explain_23_28s_timing"] != "UNKNOWN":
              raise SystemExit("RESET_VERIFY_FAILED timing not UNKNOWN")

          if struct.unpack_from("<I", ck8, 0)[0] != PACIASP:
              raise SystemExit("RESET_VERIFY_FAILED RESET8 entry not paciasp")
          if struct.unpack_from("<I", ck1, 0)[0] != PACIASP:
              raise SystemExit("RESET_VERIFY_FAILED RESET1 entry not paciasp")
          c8 = ck8[4:]
          c1 = ck1[4:]
          w8 = struct.unpack_from("<19I", t1core, 0)
          a8 = struct.unpack_from("<19I", c8, 0)
          a1 = struct.unpack_from("<19I", c1, 0)
          if w8[3] != W_DELAY_8S or a8[3] != W_DELAY_8S:
              raise SystemExit("RESET_VERIFY_FAILED 8s delay word")
          if a1[3] != W_DELAY_1S:
              raise SystemExit("RESET_VERIFY_FAILED 1s delay word")
          if c8 != t1core:
              raise SystemExit("RESET_VERIFY_FAILED RESET8 core != T1")
          for i in range(19):
              if i == 3:
                  continue
              if a8[i] != a1[i] or a8[i] != w8[i]:
                  raise SystemExit(f"RESET_VERIFY_FAILED core word {i}")
          print("RESET_VERIFY_CORE_DELAY_ONLY_DIFF=PASS")
          print("RESET_PAIR_DIAGNOSTIC_CORE_MATCHES_PROVEN_CORE=YES")

          isz = struct.unpack_from("<Q", r8, 16)[0]
          if isz != struct.unpack_from("<Q", fix8, 16)[0] or isz != 0x2230000:
              raise SystemExit(f"RESET_VERIFY_FAILED image_size {isz:#x}")
          dtb_off = align(isz + 0x80000, 0x200000) - 0x80000
          if dtb_off != 0x2380000:
              raise SystemExit(f"RESET_VERIFY_FAILED dtb_offset {dtb_off:#x}")

          off_ck = int(m["machine_restart_image_offset"], 16)
          if off_ck != 0x1849c:
              raise SystemExit(f"RESET_VERIFY_FAILED offset {off_ck:#x}")
          if m["machine_restart_va"] != "0xffff80008001849c":
              raise SystemExit(f"RESET_VERIFY_FAILED VA {m['machine_restart_va']}")
          if r8[off_ck:off_ck + plen] != ck8 or r1[off_ck:off_ck + plen] != ck1:
              raise SystemExit("RESET_VERIFY_FAILED inline region bytes")

          allowed = set(range(off_ck, off_ck + plen))
          d8 = [i for i in range(len(fix8)) if fix8[i] != r8[i]]
          d1 = [i for i in range(len(fix8)) if fix8[i] != r1[i]]
          if any(i not in allowed for i in d8 + d1):
              raise SystemExit("RESET_VERIFY_FAILED diff outside window")
          if r8[:off_ck] != fix8[:off_ck] or r8[off_ck + plen:] != fix8[off_ck + plen:]:
              raise SystemExit("RESET_VERIFY_FAILED RESET8 non-window")
          if r1[:off_ck] != fix8[:off_ck] or r1[off_ck + plen:] != fix8[off_ck + plen:]:
              raise SystemExit("RESET_VERIFY_FAILED RESET1 non-window")
          print("RESET8_VS_FIX8_ATTRIBUTION=RESTART_CHOKE_CHECKPOINT_ONLY")
          print("RESET1_VS_FIX8_ATTRIBUTION=RESTART_CHOKE_CHECKPOINT_ONLY")

          pair = [i for i in range(len(r8)) if r8[i] != r1[i]]
          if pair != [off_ck + 16, off_ck + 17]:
              raise SystemExit(
                  "RESET_VERIFY_FAILED pair diff "
                  f"{[hex(i) for i in pair[:8]]}")
          if struct.unpack_from("<I", r8, off_ck + 16)[0] != W_DELAY_8S:
              raise SystemExit("RESET_VERIFY_FAILED RESET8 delay word")
          if struct.unpack_from("<I", r1, off_ck + 16)[0] != W_DELAY_1S:
              raise SystemExit("RESET_VERIFY_FAILED RESET1 delay word")
          print("RESET_PAIR_DIFF_BYTE_COUNT=2")
          print(f"RESET_PAIR_DIFF_RANGES=[['{off_ck+16:#x}', '{off_ck+18:#x}']]")
          print("RESET_PAIR_CHANGED_INSTRUCTIONS=[4]")
          print("RESET_PAIR_DIFF_ATTRIBUTED=DELAY_CONSTANT_ONLY")

          off_sk = int(m["start_kernel_image_offset"], 16)
          off_ps = int(m["primary_switched_image_offset"], 16)
          off_c6 = int(m["c6_image_offset"], 16)
          off_cd = int(m["c_delay_image_offset"], 16)
          off_panic = int(m["panic_image_offset"], 16)
          if struct.unpack_from("<I", r8, off_sk)[0] != PACIASP:
              raise SystemExit("RESET_VERIFY_FAILED start_kernel entry")
          if r8[off_sk:off_sk + 80] != fix8[off_sk:off_sk + 80]:
              raise SystemExit("RESET_VERIFY_FAILED T3 probe still present")
          if r8[off_c6:off_c6 + 76] != fix8[off_c6:off_c6 + 76]:
              raise SystemExit("RESET_VERIFY_FAILED C6 != FIX8")
          if r8[off_cd:off_cd + 76] != fix8[off_cd:off_cd + 76]:
              raise SystemExit("RESET_VERIFY_FAILED C_DELAY != FIX8")
          if r8[off_ps:off_ps + 80] != fix8[off_ps:off_ps + 80]:
              raise SystemExit("RESET_VERIFY_FAILED T2 probe still present")
          if r8[off_panic:off_panic + 80] != fix8[off_panic:off_panic + 80]:
              raise SystemExit("RESET_VERIFY_FAILED PENTRY probe still present")
          print("RESET_PAIR_ALL_PRIOR_PROBES_REMOVED=YES")

          tramp = r8[0x40:0x70]
          if sha(tramp) != ("362d9c6e08863f79327364532372c6ecc9086e6211635e7fa4a6db4d"
                            "747dc623"):
              raise SystemExit("RESET_VERIFY_FAILED trampoline")
          if tramp != fix8[0x40:0x70] or tramp != r1[0x40:0x70]:
              raise SystemExit("RESET_VERIFY_FAILED trampoline bytes")
          print("RESET_VERIFY_TRAMPOLINE=FROZEN_FIX8_BYTE_IDENTICAL")

          words = struct.unpack_from("<20I", ck8, 0)
          pad_n = 1
          smc = [i for i, w in enumerate(words) if w == 0xD4000003]
          if len(smc) != 1 or smc[0] != 16 + pad_n:
              raise SystemExit(f"RESET_VERIFY_FAILED smc index {smc}")
          if words[17 + pad_n] != 0xD503205F:
              raise SystemExit("RESET_VERIFY_FAILED no wfe")
          if (words[18 + pad_n] >> 26) != 0b000101:
              raise SystemExit("RESET_VERIFY_FAILED no branch after wfe")
          if ((18 + pad_n) * 4 + sx(words[18 + pad_n] & 0x03FFFFFF, 26) * 4
                  != (17 + pad_n) * 4):
              raise SystemExit("RESET_VERIFY_FAILED terminal b != wfe")
          print("RESET_VERIFY_FAIL_CLOSED=SMC_WFE_LOOP_NO_CONTINUATION")
          print("RESET_VERIFY_PSCI_FID=0x84000009")

          if r8[dtb_off:] != rtd or r1[dtb_off:] != rtd or sha(rtd) != (
                  "4849743205af9d00f4b5bcd01070aac68be7dc6095497506935"
                  "6d29fe33df327") or len(rtd) != 144593:
              raise SystemExit("RESET_VERIFY_FAILED trailer != frozen RT-D")
          boot_est = (4096 + len(r8) + 4095) & ~4095
          boot_est += 4096
          if boot_est != 37380096:
              raise SystemExit(f"RESET_VERIFY_FAILED boot_est {boot_est}")
          print(f"RESET8_PAYLOAD_SHA={sha(r8)}")
          print(f"RESET1_PAYLOAD_SHA={sha(r1)}")
          print(f"PAYLOAD_SIZE={len(r8)}")
          print("RESET_PAIR_INIT_IDENTICAL=YES")
          print("RESET_VERIFY_GATES=PASS")
          print("DEVICE_OPERATION=NO")
          print("PRIVATE_PACK_RUN=NONE")
          print("READY_FOR_DEVICE=NO")
          print("MAINLINE_V2_R3_P1B_RESTART_CHOKEPOINT_PREDEVICE_COMPLETE=YES")
          PY

      - name: Assert constraints + assemble verdict
        shell: bash
        run: |
          set -euo pipefail
          if find . -name '*.img' -print -quit | grep -q .; then
            echo 'device image emitted' >&2
            exit 1
          fi
          {
            echo "MAINLINE_V2_R3_P1B_RESTART_CHOKEPOINT_PREDEVICE_READINESS_CI"
            echo "DEVICE_OPERATION=NO"
            echo "PARTITION_WRITES=0"
            echo "SLOT_A_WRITTEN=NO"
            echo "PRIVATE_PACK_RUN=NONE"
            echo "READY_FOR_DEVICE=NO"
            echo "--- pair audit ---"
            cat art/p1b-reset-pair-audit.txt
            echo "--- gates ---"
            cat art/p1b-reset-gates.txt
            echo "--- design ---"
            cat art/restart-chokepoint-pair-design.json
          } > verdict.txt
          cat verdict.txt >> "$GITHUB_STEP_SUMMARY"
          echo 'RESET_PAIR_PUBLIC_CI_STATUS=PASS'
          echo 'MAINLINE_V2_R3_P1B_RESTART_CHOKEPOINT_PREDEVICE_COMPLETE=YES'
