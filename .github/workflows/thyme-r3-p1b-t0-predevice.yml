name: thyme-r3-p1b-t0-predevice

# MAINLINE_V2_R3_P1B_T0_PREDEVICE_READINESS_CI — CI / SOURCE AUDIT /
# ARTIFACT PREPARATION ONLY. No device operation anywhere; no *.img is
# emitted from this repo (boot v3 packing is private-GHA-only).
# Deliverables:
#   source-audit  boundary gate over the T0 device source (fail-closed:
#                 smc-return -> wfe forever, no primary_entry continuation),
#                 the CI prototype (fall-through must STAY for the section-14
#                 audit), the T0 observer + fixtures, docs and this workflow
#   t0-build      frozen-FIX8-anchored T0-8 candidate: FIX8 identity from the
#                 authoritative run 34741153230 (NO kernel rebuild), frozen
#                 trampoline disassembly + branch algebra, T0 trampoline
#                 build + gates, payload patch ([0x40,0xB0) only), negative
#                 fixtures, preregistered decoder fixtures, observer
#                 fixtures; uploads artifact thyme-r3-p1b-t0
#   verify        independent structural re-verification of the uploaded T0
#                 payload against the frozen FIX8 payload + RT-D trailer
on:
  push:
    branches: [route-b-v3]
    paths:
      - '.github/workflows/thyme-r3-p1b-t0-predevice.yml'
      - 'scripts/r3-p1b/p1b-t0-device.S'
      - 'scripts/r3-p1b/p1b-t0-device.ld'
      - 'scripts/r3-p1b/p1b-t0-predevice.py'
      - 'scripts/r3-p1b/observe-r3-p1b-t0.py'
      - 'scripts/r3-p1b/observer-t0-fixtures.py'
      - 'scripts/r3-p1b/p1b-panic-checkpoint-isolation.py'
      - 'scripts/r3-p1b/p1b-build.py'
      - 'scripts/r3-p1b/p1b-trampoline.S'
      - 'scripts/r3-p1b/p1b-trampoline.ld'
      - 'docs/route-r3-p1b-t0-predevice-readiness.md'
      - 'docs/route-r3-current-status.md'
  pull_request:
    paths:
      - '.github/workflows/thyme-r3-p1b-t0-predevice.yml'
      - 'scripts/r3-p1b/**'
      - 'docs/route-r3-p1b-t0-predevice-readiness.md'
  workflow_dispatch:
    inputs:
      rt_d_run_id:
        description: Public GHA run id carrying artifact thyme-r3-runtime-dtb
        required: false
        default: "34678001413"
      fix8_run_id:
        description: Public GHA run id carrying artifact thyme-r3-p1b-fix8-fix24
        required: false
        default: "34741153230"

concurrency:
  group: thyme-r3-p1b-t0-predevice-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  source-audit:
    name: R3 P1B T0 predevice source gate
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Checkout project
        uses: actions/checkout@v4

      - name: Lint workflow in Actions
        uses: docker://rhysd/actionlint:latest
        with:
          args: -color .github/workflows/thyme-r3-p1b-t0-predevice.yml

      - name: Parse builders
        run: |
          python3 -m py_compile scripts/r3-p1b/p1b-build.py
          python3 -m py_compile scripts/r3-p1b/p1b-panic-checkpoint-isolation.py
          python3 -m py_compile scripts/r3-p1b/p1b-t0-predevice.py
          python3 -m py_compile scripts/r3-p1b/observe-r3-p1b-t0.py
          python3 -m py_compile scripts/r3-p1b/observer-t0-fixtures.py

      - name: T0 predevice source-gate
        env:
          GITHUB_ACTIONS: "true"
        run: |
          python3 scripts/r3-p1b/p1b-t0-predevice.py --mode source-gate

      - name: Assert constraints
        shell: bash
        run: |
          set -euo pipefail
          if git ls-files | grep -Ei '(^|/)(r3-p1b|p1b).*\.(img)$'; then
            echo 'tracked p1b flashable binary found' >&2
            exit 1
          fi
          echo 'LOCAL_BUILD=NO'
          echo 'GHA_ONLY=YES'
          echo 'DEVICE_OPERATION=NO'
          echo 'ADB_DEVICE_OPERATION=NO'
          echo 'FASTBOOT_DEVICE_OPERATION=NO'
          echo 'PARTITION_WRITES=0'
          echo 'SLOT_A_WRITTEN=NO'
          echo 'READY_FOR_DEVICE=NO'

  t0-build:
    name: R3 P1B T0-8 fail-closed build + identity/diff/geometry gates
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    needs: [source-audit]
    steps:
      - name: Checkout project
        uses: actions/checkout@v4

      - name: Install pinned LLVM 18.1.3 toolchain
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo apt-get install -y clang lld llvm
          clang --version | head -1 | tee clang-version.txt
          grep -F '18.1.3' clang-version.txt

      - name: Download frozen RT-D from public GHA
        env:
          GH_TOKEN: ${{ github.token }}
          RT_D_RUN_ID: ${{ inputs.rt_d_run_id || '34678001413' }}
        run: |
          set -euo pipefail
          gh run download "$RT_D_RUN_ID" \
            --repo "${{ github.repository }}" \
            --name thyme-r3-runtime-dtb --dir rt-d
          test -s rt-d/rt-d.dtb
          printf '%s  rt-d/rt-d.dtb\n' \
            4849743205af9d00f4b5bcd01070aac68be7dc60954975069356d29fe33df327 \
            | sha256sum -c -
          echo 'RT_D_SOURCE=PUBLIC_GHA_RUN'

      - name: Download frozen FIXED INIT8 payload from public GHA
        env:
          GH_TOKEN: ${{ github.token }}
          FIX8_RUN_ID: ${{ inputs.fix8_run_id || '34741153230' }}
        run: |
          set -euo pipefail
          gh run download "$FIX8_RUN_ID" \
            --repo "${{ github.repository }}" \
            --name thyme-r3-p1b-fix8-fix24 --dir fix8
          test -s fix8/thyme-r3-p1b-fix8-kernel-payload.bin
          printf '%s  fix8/thyme-r3-p1b-fix8-kernel-payload.bin\n' \
            4f34eabf670a735b3a10ebd0fb005e937faba881ea23fdc0843cf4ac96cceb41 \
            | sha256sum -c -
          echo 'FIX8_PAYLOAD_BASE=PUBLIC_GHA_RUN_34741153230'

      - name: Build fail-closed T0-8 + run all gates
        env:
          GITHUB_ACTIONS: "true"
        run: |
          set -o pipefail
          mkdir -p out-t0
          python3 scripts/r3-p1b/p1b-t0-predevice.py \
            --mode t0 --out out-t0 \
            --rt-d rt-d/rt-d.dtb \
            --fix8-payload fix8/thyme-r3-p1b-fix8-kernel-payload.bin \
            | tee out-t0-run.txt
          grep -Fxq 'T0_BUILD_GATES=PASS' out-t0/p1b-t0-gates.txt
          grep -Fxq 'T0_BASELINE=FROZEN_FIX8' out-t0/p1b-t0-gates.txt
          grep -Fxq 'T0_AFTER_X0_X3_SETUP=YES' out-t0/p1b-t0-gates.txt
          grep -Fxq 'T0_BEFORE_PRIMARY_ENTRY_BRANCH=YES' out-t0/p1b-t0-gates.txt
          grep -Fxq 'T0_DEVICE_CANDIDATE_DELAY=8s' out-t0/p1b-t0-gates.txt
          grep -Fxq 'T0_TIMER_PRIMITIVE=CNTPCT_REGISTER_ONLY' out-t0/p1b-t0-gates.txt
          grep -Fxq 'T0_RESET_PRIMITIVE=PSCI_SYSTEM_RESET_0x84000009_SMC' \
            out-t0/p1b-t0-gates.txt
          grep -Fxq 'T0_FAIL_CLOSED_AFTER_RESET_RETURN=YES' out-t0/p1b-t0-gates.txt
          grep -Fxq 'T0_NO_STACK=YES' out-t0/p1b-t0-gates.txt
          grep -Fxq 'T0_NO_MEMORY_WRITES=YES' out-t0/p1b-t0-gates.txt
          grep -Fxq 'T0_POSITION_INDEPENDENT=YES' out-t0/p1b-t0-gates.txt
          grep -Fxq 'T0_RUNTIME_RELOCATIONS=0' out-t0/p1b-t0-gates.txt
          grep -Fxq 'T0_RUNTIME_SEMANTIC_DELTA=TRAMPOLINE_CHECKPOINT_RESET_ONLY' \
            out-t0/p1b-t0-gates.txt
          grep -Fxq 'T0_PAYLOAD_DIFF_ATTRIBUTED=CHECKPOINT_REGION_ONLY' \
            out-t0/p1b-t0-gates.txt
          grep -Fxq 'T0_PAYLOAD_SIZE_IDENTICAL=YES' out-t0/p1b-t0-gates.txt
          grep -Fxq 'T0_BOOT_SIZE_IDENTICAL=YES' out-t0/p1b-t0-gates.txt
          grep -Fxq 'T0_RT_D_IDENTITY=YES' out-t0/p1b-t0-gates.txt
          grep -Fxq 'T0_GEOMETRY_GATES=PASS' out-t0/p1b-t0-gates.txt
          grep -Fxq 'T0_NEGATIVE_FIXTURES=PASS' out-t0/p1b-t0-gates.txt
          grep -Fxq 'T0_DECODER_FIXTURES=PASS' out-t0/p1b-t0-gates.txt
          grep -Fxq \
            'T0_PROTOTYPE_FALLTHROUGH_AUDIT=DEVICE_PROTOTYPE_NOT_READY_FAIL_CLOSED_REGENERATED' \
            out-t0/p1b-t0-gates.txt
          grep -Fxq 'READY_FOR_DEVICE=NO' out-t0/p1b-t0-gates.txt

      - name: T0 observer fixtures
        env:
          GITHUB_ACTIONS: "true"
        run: |
          python3 scripts/r3-p1b/p1b-t0-predevice.py \
            --mode observer-fixtures --out out-t0
          grep -Fxq 'OBSERVER_T0_AST_DEADLOCK_GATE=PASS' \
            out-t0/p1b-t0-observer-fixtures.txt
          grep -Fxq 'OBSERVER_T0_IDENTITY_PANIC30_MISBOOT_REFUSED=PASS' \
            out-t0/p1b-t0-observer-fixtures.txt
          grep -Fxq 'OBSERVER_T0_IDENTITY_FIX8_MISBOOT_REFUSED=PASS' \
            out-t0/p1b-t0-observer-fixtures.txt
          grep -Fxq 'OBSERVER_T0_NEGATIVE_NO_NOT_REACHED_LICENSE_CASE=PASS' \
            out-t0/p1b-t0-observer-fixtures.txt
          grep -Fxq 'OBSERVER_T0_FAST_RETURN_ALONE_INSUFFICIENT_CASE=PASS' \
            out-t0/p1b-t0-observer-fixtures.txt
          grep -Fxq 'OBSERVER_T0_SUMMARY_FIXTURE=PASS' \
            out-t0/p1b-t0-observer-fixtures.txt

      - name: Assert no flashable output exists
        shell: bash
        run: |
          set -euo pipefail
          if find . -name '*.img' -print -quit | grep -q .; then
            echo 'flashable image emitted' >&2
            exit 1
          fi
          echo 'PUBLIC_R3_P1B_T0_NO_BOOT_IMAGE=PASS'
          echo 'DEVICE_OPERATION=NO'
          echo 'SLOT_A_WRITTEN=NO'

      - name: Stage T0 release inputs
        run: |
          mkdir -p out-t0-release
          cp out-t0/thyme-r3-p1b-t0-kernel-payload.bin out-t0-release/
          cp out-t0/t0-payload-diff-report.txt out-t0-release/
          cp out-t0/p1b-t0-device-trampoline.bin \
            out-t0/p1b-t0-device-trampoline.elf \
            out-t0/p1b-t0-device-trampoline-disasm.txt out-t0-release/
          cp out-t0/frozen-fix8-trampoline.bin \
            out-t0/frozen-fix8-trampoline.elf \
            out-t0/frozen-fix8-trampoline-disasm.txt out-t0-release/
          cp out-t0/p1b-t0-negative-fixtures.txt out-t0-release/
          cp out-t0/p1b-t0-decoder-fixtures.txt out-t0-release/
          cp out-t0/p1b-t0-observer-fixtures.txt out-t0-release/
          cp out-t0/p1b-t0-report.txt out-t0/p1b-t0-manifest.json \
            out-t0/p1b-t0-gates.txt out-t0-release/
          cp out-t0-run.txt out-t0-release/
          ( cd out-t0-release && sha256sum \
              thyme-r3-p1b-t0-kernel-payload.bin \
              p1b-t0-device-trampoline.bin frozen-fix8-trampoline.bin \
              > SHA256SUMS )
          cat out-t0-release/SHA256SUMS

      - name: Upload T0 artifacts
        uses: actions/upload-artifact@v4
        with:
          name: thyme-r3-p1b-t0
          if-no-files-found: error
          path: out-t0-release/**

  verify:
    name: R3 P1B T0 independent re-verification
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    needs: t0-build
    steps:
      - name: Download this run artifacts
        env:
          GH_TOKEN: ${{ github.token }}
          RUN_ID: ${{ github.run_id }}
        run: |
          set -euo pipefail
          gh run download "$RUN_ID" \
            --repo "${{ github.repository }}" \
            --name thyme-r3-p1b-t0 --dir art
          ( cd art && sha256sum -c SHA256SUMS )
          echo 'ARTIFACT_SHA_RECHECK=PASS'

      - name: Download frozen FIX8 payload + RT-D again
        env:
          GH_TOKEN: ${{ github.token }}
          FIX8_RUN_ID: ${{ inputs.fix8_run_id || '34741153230' }}
          RT_D_RUN_ID: ${{ inputs.rt_d_run_id || '34678001413' }}
        run: |
          set -euo pipefail
          gh run download "$FIX8_RUN_ID" \
            --repo "${{ github.repository }}" \
            --name thyme-r3-p1b-fix8-fix24 --dir fix8
          printf '%s  fix8/thyme-r3-p1b-fix8-kernel-payload.bin\n' \
            4f34eabf670a735b3a10ebd0fb005e937faba881ea23fdc0843cf4ac96cceb41 \
            | sha256sum -c -
          gh run download "$RT_D_RUN_ID" \
            --repo "${{ github.repository }}" \
            --name thyme-r3-runtime-dtb --dir rt-d
          printf '%s  rt-d/rt-d.dtb\n' \
            4849743205af9d00f4b5bcd01070aac68be7dc60954975069356d29fe33df327 \
            | sha256sum -c -

      - name: Independent structured re-verification
        env:
          GITHUB_ACTIONS: "true"
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import hashlib, json, struct, sys
          from pathlib import Path

          def sha(b): return hashlib.sha256(b).hexdigest()
          def sx(v, bits):
              m = 1 << bits
              return v - m if v & (m >> 1) else v

          t0 = Path("art/thyme-r3-p1b-t0-kernel-payload.bin").read_bytes()
          fix8 = Path("fix8/thyme-r3-p1b-fix8-kernel-payload.bin").read_bytes()
          rtd = Path("rt-d/rt-d.dtb").read_bytes()
          manifest = json.loads(Path("art/p1b-t0-manifest.json").read_text())

          if sha(t0) != manifest["t0_payload_sha256"]:
              raise SystemExit("T0_VERIFY_FAILED payload sha vs manifest")
          if len(t0) != 37369041 or len(fix8) != len(t0):
              raise SystemExit(f"T0_VERIFY_FAILED size {len(t0)}")
          dtb_off = (0x2230000 + 0x80000 + 0x1FFFFF) & ~0x1FFFFF
          dtb_off -= 0x80000
          if dtb_off != 0x2380000:
              raise SystemExit(f"T0_VERIFY_FAILED dtb_offset {dtb_off:#x}")
          if struct.unpack_from("<Q", t0, 16)[0] != 0x2230000:
              raise SystemExit("T0_VERIFY_FAILED image_size")
          if struct.unpack_from("<I", t0, 4)[0] != 0x1400000F:
              raise SystemExit("T0_VERIFY_FAILED code1")

          # Region attribution: only the trampoline checkpoint [0x40, 0xB0)
          # may differ from the frozen FIX8 payload; trailer is RT-D itself.
          tlen = manifest["t0_tramp_size"]
          if tlen != 112:
              raise SystemExit(f"T0_VERIFY_FAILED tramp size {tlen}")
          if t0[:0x40] != fix8[:0x40]:
              raise SystemExit("T0_VERIFY_FAILED prefix drifted")
          if t0[0x40 + tlen:dtb_off] != fix8[0x40 + tlen:dtb_off]:
              raise SystemExit("T0_VERIFY_FAILED diff outside checkpoint")
          if t0[dtb_off:] != rtd or sha(rtd) != (
                  "4849743205af9d00f4b5bcd01070aac68be7dc6095497506935"
                  "6d29fe33df327") or len(rtd) != 144593:
              raise SystemExit("T0_VERIFY_FAILED trailer != frozen RT-D")
          print("T0_VERIFY_DIFF_ATTRIBUTION=CHECKPOINT_REGION_ONLY")
          print("T0_VERIFY_TRAILER=FROZEN_RT_D")

          # Fail-closed terminal structure decoded from raw words.
          tramp = t0[0x40:0x40 + tlen]
          if sha(tramp) != manifest["t0_tramp_sha256"]:
              raise SystemExit("T0_VERIFY_FAILED tramp sha vs manifest")
          words = struct.unpack_from(f"<{tlen // 4}I", tramp, 0)
          smc = [i for i, w in enumerate(words) if w == 0xD4000003]
          if len(smc) != 1:
              raise SystemExit(f"T0_VERIFY_FAILED smc count {smc}")
          i = smc[0]
          wfe_addr = (i + 1) * 4
          if words[i + 1] != 0xD503205F:
              raise SystemExit("T0_VERIFY_FAILED no wfe after smc")
          w = words[i + 2]
          if (w >> 26) != 0b000101:
              raise SystemExit("T0_VERIFY_FAILED no branch after wfe")
          target = (i + 2) * 4 + sx(w & 0x03FFFFFF, 26) * 4
          if target != wfe_addr:
              raise SystemExit(
                  f"T0_VERIFY_FAILED terminal b target {target:#x} "
                  f"!= wfe {wfe_addr:#x}")
          # movz x10, #8 (CNTPCT-scaled 8s delay word at trampoline 0x24).
          if words[9] != 0xD280010A:
              raise SystemExit(f"T0_VERIFY_FAILED delay word {words[9]:#010x}")
          # No branch may leave the trampoline: unconditional B/BL (26-bit
          # imm) and B.cond (19-bit imm) targets all stay in [0, 0x70).
          for idx, w in enumerate(words):
              addr = idx * 4
              if addr >= 0x68:
                  break
              top = w >> 26
              if top == 0b000101 or top == 0b100101:
                  t = addr + sx(w & 0x03FFFFFF, 26) * 4
              elif (w >> 24) == 0x54:
                  t = addr + sx((w >> 5) & 0x7FFFF, 19) * 4
              else:
                  continue
              if not (0 <= t < 0x70):
                  raise SystemExit(
                      f"T0_VERIFY_FAILED branch leaves trampoline: "
                      f"{addr:#x} -> {t:#x}")
          boot_est = (4096 + len(t0) + 4095) & ~4095
          boot_est += 4096
          if boot_est != 37380096:
              raise SystemExit(f"T0_VERIFY_FAILED boot_est {boot_est}")
          if 201326592 - boot_est < 0x1000000:
              raise SystemExit("T0_VERIFY_FAILED capacity")
          print("T0_VERIFY_FAIL_CLOSED=SMC_WFE_LOOP_NO_PRIMARY_ENTRY")
          print(f"T0_VERIFY_PAYLOAD_SIZE={len(t0)} boot_size_est={boot_est}")
          print("T0_VERIFY_GATES=PASS")
          print("DEVICE_OPERATION=NO")
          print("READY_FOR_DEVICE=NO")
          PY

      - name: Assert constraints + assemble verdict
        shell: bash
        run: |
          set -euo pipefail
          if find . -name '*.img' -print -quit | grep -q .; then
            echo 'flashable image emitted' >&2
            exit 1
          fi
          {
            echo "MAINLINE_V2_R3_P1B_T0_PREDEVICE_READINESS_CI (CI ONLY)"
            echo "DEVICE_OPERATION=NO"
            echo "PARTITION_WRITES=0"
            echo "SLOT_A_WRITTEN=NO"
            echo "--- gates ---"
            cat art/p1b-t0-gates.txt
            echo "--- manifest ---"
            cat art/p1b-t0-manifest.json
          } > verdict.txt
          cat verdict.txt >> "$GITHUB_STEP_SUMMARY"
          echo 'T0_PREDEVICE_READINESS_CI_VERDICT=CI_PASS'
