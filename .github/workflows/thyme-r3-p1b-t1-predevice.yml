name: thyme-r3-p1b-t1-predevice

# MAINLINE_V2_R3_P1B_T1_PREDEVICE_READINESS_CI — CI / SOURCE AUDIT /
# ARTIFACT PREPARATION ONLY. No device operation anywhere; this public
# repository never emits a device-installable image (boot v3 packing is
# private-GHA-only).
# Deliverables:
#   source-audit  boundary gate over the T1 diagnostic source (fail-closed:
#                 any smc return -> wfe forever, no primary_entry
#                 continuation) plus the retained CI prototype, the T1
#                 observer + fixtures, the docs and this workflow
#   t1-build      frozen-FIX8-anchored T1-8 candidate: authoritative kernel
#                 rebuild (vmlinux + System.map), primary_entry re-derivation
#                 (never a history constant), original first-instruction
#                 confirmation from head.S + payload bytes + vmlinux
#                 disassembly, image_size re-read from the real header,
#                 checkpoint placement outside the image_size runtime
#                 footprint, frozen-byte payload patch, diff attribution,
#                 negative fixtures, matched-control decoder fixtures,
#                 observer fixtures; uploads artifact thyme-r3-p1b-t1
#   verify        independent structural re-verification of the uploaded T1
#                 payload against the frozen FIX8 payload + RT-D trailer
on:
  push:
    branches: [route-b-v3]
    paths:
      - '.github/workflows/thyme-r3-p1b-t1-predevice.yml'
      - 'scripts/r3-p1b/p1b-t1-device.S'
      - 'scripts/r3-p1b/p1b-t1-device.ld'
      - 'scripts/r3-p1b/p1b-t1-gap-probe.S'
      - 'scripts/r3-p1b/p1b-t1-gap.ld'
      - 'scripts/r3-p1b/p1b-t1-predevice.py'
      - 'scripts/r3-p1b/observe-r3-p1b-t1.py'
      - 'scripts/r3-p1b/observer-t1-fixtures.py'
      - 'scripts/r3-p1b/p1b-panic-checkpoint-isolation.py'
      - 'scripts/r3-p1b/p1b-build.py'
      - 'scripts/r3-p1b/p1b-trampoline.S'
      - 'scripts/r3-p1b/p1b-trampoline.ld'
      - 'docs/route-r3-p1b-t1-predevice-readiness.md'
      - 'docs/route-r3-current-status.md'
  pull_request:
    paths:
      - '.github/workflows/thyme-r3-p1b-t1-predevice.yml'
      - 'scripts/r3-p1b/**'
      - 'docs/route-r3-p1b-t1-predevice-readiness.md'
  workflow_dispatch:
    inputs:
      rt_d_run_id:
        description: Public GHA run id carrying artifact thyme-r3-runtime-dtb
        required: false
        default: "34678001413"
      fix8_run_id:
        description: Public GHA run id carrying artifact thyme-r3-p1b-fix8-fix24
        required: false
        default: "34741153230"

concurrency:
  group: thyme-r3-p1b-t1-predevice-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  source-audit:
    name: R3 P1B T1 predevice source gate
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Checkout project
        uses: actions/checkout@v4

      - name: Lint workflow in Actions
        uses: docker://rhysd/actionlint:latest
        with:
          args: -color .github/workflows/thyme-r3-p1b-t1-predevice.yml

      - name: Parse builders
        run: |
          python3 -m py_compile scripts/r3-p1b/p1b-build.py
          python3 -m py_compile scripts/r3-p1b/p1b-panic-checkpoint-isolation.py
          python3 -m py_compile scripts/r3-p1b/p1b-t1-predevice.py
          python3 -m py_compile scripts/r3-p1b/observe-r3-p1b-t1.py
          python3 -m py_compile scripts/r3-p1b/observer-t1-fixtures.py

      - name: T1 predevice source-gate
        env:
          GITHUB_ACTIONS: "true"
        run: |
          python3 scripts/r3-p1b/p1b-t1-predevice.py --mode source-gate

      - name: Assert constraints
        shell: bash
        run: |
          set -euo pipefail
          if git ls-files | grep -Ei '(^|/)(r3-p1b|p1b).*\.(img)$'; then
            echo 'tracked p1b device image found' >&2
            exit 1
          fi
          echo 'LOCAL_BUILD=NO'
          echo 'GHA_ONLY=YES'
          echo 'DEVICE_OPERATION=NO'
          echo 'HOST_DEVICE_INTERFACE=UNUSED'
          echo 'PARTITION_WRITES=0'
          echo 'SLOT_A_WRITTEN=NO'
          echo 'READY_FOR_DEVICE=NO'

  t1-build:
    name: R3 P1B T1-8 fail-closed build + identity/diff/geometry gates
    runs-on: ubuntu-24.04
    timeout-minutes: 150
    needs: [source-audit]
    steps:
      - name: Checkout project
        uses: actions/checkout@v4

      - name: Install pinned LLVM 18.1.3 toolchain
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo apt-get install -y \
            clang lld llvm make gcc bc bison flex libssl-dev libelf-dev \
            cpio file python3 gcc-aarch64-linux-gnu \
            binutils-aarch64-linux-gnu
          clang --version | head -1 | tee clang-version.txt
          grep -F '18.1.3' clang-version.txt
          echo "TOOLCHAIN_PINNED=$(clang --version | head -1)"

      - name: Fetch pinned linux-6.6
        run: |
          set -euo pipefail
          git submodule update --init --depth 1 linux-6.6
          base=$(git -C linux-6.6 rev-parse HEAD)
          echo "LINUX_BASE_COMMIT=$base"
          test "$base" = 8b73de7da85fde281a385e0b26eda9bffd3ca477

      - name: Download frozen RT-D from public GHA
        env:
          GH_TOKEN: ${{ github.token }}
          RT_D_RUN_ID: ${{ inputs.rt_d_run_id || '34678001413' }}
        run: |
          set -euo pipefail
          gh run download "$RT_D_RUN_ID" \
            --repo "${{ github.repository }}" \
            --name thyme-r3-runtime-dtb --dir rt-d
          test -s rt-d/rt-d.dtb
          printf '%s  rt-d/rt-d.dtb\n' \
            4849743205af9d00f4b5bcd01070aac68be7dc60954975069356d29fe33df327 \
            | sha256sum -c -
          echo 'RT_D_SOURCE=PUBLIC_GHA_RUN'

      - name: Download frozen FIXED INIT8 payload from public GHA
        env:
          GH_TOKEN: ${{ github.token }}
          FIX8_RUN_ID: ${{ inputs.fix8_run_id || '34741153230' }}
        run: |
          set -euo pipefail
          gh run download "$FIX8_RUN_ID" \
            --repo "${{ github.repository }}" \
            --name thyme-r3-p1b-fix8-fix24 --dir fix8
          test -s fix8/thyme-r3-p1b-fix8-kernel-payload.bin
          printf '%s  fix8/thyme-r3-p1b-fix8-kernel-payload.bin\n' \
            4f34eabf670a735b3a10ebd0fb005e937faba881ea23fdc0843cf4ac96cceb41 \
            | sha256sum -c -
          echo 'FIX8_PAYLOAD_BASE=PUBLIC_GHA_RUN_34741153230'

      - name: Build fail-closed T1-8 + run all gates
        env:
          GITHUB_ACTIONS: "true"
        run: |
          set -o pipefail
          mkdir -p out-t1
          python3 scripts/r3-p1b/p1b-t1-predevice.py \
            --mode t1 --out out-t1 --jobs "$(nproc)" \
            --rt-d rt-d/rt-d.dtb \
            --fix8-payload fix8/thyme-r3-p1b-fix8-kernel-payload.bin \
            | tee out-t1-run.txt
          grep -Fxq 'T1_BUILD_GATES=PASS' out-t1/p1b-t1-gates.txt
          grep -Fxq 'T1_BASELINE=FROZEN_FIX8' out-t1/p1b-t1-gates.txt
          grep -Fxq 'T1_PRIMARY_ENTRY_OFFSET_REDERIVED=YES' \
            out-t1/p1b-t1-gates.txt
          grep -Fxq 'T1_PRIMARY_ENTRY_ORIGINAL_INSN=bl record_mmu_state' \
            out-t1/p1b-t1-gates.txt
          grep -Fxq 'T1_PRIMARY_ENTRY_ORIGINAL_INSN_SOURCES_AGREE=YES' \
            out-t1/p1b-t1-gates.txt
          grep -Fxq 'IMAGE_HEADER_IMAGE_SIZE_REDERIVED=YES' \
            out-t1/p1b-t1-gates.txt
          grep -Fxq 'T1_CHECKPOINT_OUTSIDE_IMAGE_FILE=YES' \
            out-t1/p1b-t1-gates.txt
          grep -Fxq 'T1_CHECKPOINT_OUTSIDE_IMAGE_SIZE=YES' \
            out-t1/p1b-t1-gates.txt
          grep -Fxq 'T1_CHECKPOINT_BEFORE_RTD=YES' out-t1/p1b-t1-gates.txt
          grep -Fxq 'T1_CHECKPOINT_PADDING_ZERO=YES' out-t1/p1b-t1-gates.txt
          grep -Fxq 'T1_CHECKPOINT_PADDING_REGION_SAFE=YES' \
            out-t1/p1b-t1-gates.txt
          grep -Fxq 'T1_BRANCH_IN_RANGE=YES' out-t1/p1b-t1-gates.txt
          grep -Fxq 'T1_DEVICE_CANDIDATE_DELAY=8s' out-t1/p1b-t1-gates.txt
          grep -Fxq 'T1_TIMER_PRIMITIVE=CNTPCT_REGISTER_ONLY' \
            out-t1/p1b-t1-gates.txt
          grep -Fxq 'T1_RESET_PRIMITIVE=PSCI_SYSTEM_RESET_0x84000009_SMC' \
            out-t1/p1b-t1-gates.txt
          grep -Fxq 'T1_FAIL_CLOSED=YES' out-t1/p1b-t1-gates.txt
          grep -Fxq 'T1_NO_STACK=YES' out-t1/p1b-t1-gates.txt
          grep -Fxq 'T1_NO_MEMORY_WRITES=YES' out-t1/p1b-t1-gates.txt
          grep -Fxq 'T1_NO_X0_DEREFERENCE=YES' out-t1/p1b-t1-gates.txt
          grep -Fxq 'T1_POSITION_INDEPENDENT=YES' out-t1/p1b-t1-gates.txt
          grep -Fxq 'T1_RUNTIME_RELOCATIONS=0' out-t1/p1b-t1-gates.txt
          grep -Fxq \
            'T1_RUNTIME_SEMANTIC_DELTA=PRIMARY_ENTRY_REACHABILITY_CHECKPOINT_ONLY' \
            out-t1/p1b-t1-gates.txt
          grep -Fxq 'T1_TRAMPOLINE_IDENTICAL_TO_FIX8=YES' \
            out-t1/p1b-t1-gates.txt
          grep -Fxq 'T1_RT_D_IDENTITY=YES' out-t1/p1b-t1-gates.txt
          grep -Fxq 'T1_INIT_IDENTITY=YES' out-t1/p1b-t1-gates.txt
          grep -Fxq 'T1_INITRAMFS_IDENTITY=YES' out-t1/p1b-t1-gates.txt
          grep -Fxq \
            'T1_PAYLOAD_DIFF_ATTRIBUTED=PRIMARY_ENTRY_PATCH_PLUS_CHECKPOINT_REGION_ONLY' \
            out-t1/p1b-t1-gates.txt
          grep -Fxq 'T1_PAYLOAD_SIZE_IDENTICAL=YES' out-t1/p1b-t1-gates.txt
          grep -Fxq 'T1_BOOT_SIZE_IDENTICAL=YES' out-t1/p1b-t1-gates.txt
          grep -Fxq 'T1_GEOMETRY_GATES=PASS' out-t1/p1b-t1-gates.txt
          grep -Fxq 'T1_NEGATIVE_FIXTURES=PASS' out-t1/p1b-t1-gates.txt
          grep -Fxq 'T1_DECODER_FIXTURES=PASS' out-t1/p1b-t1-gates.txt
          grep -Fxq 'T1_DIAGNOSTIC_ONLY=YES' out-t1/p1b-t1-gates.txt
          grep -Fxq 'T1_NORMAL_KERNEL_BOOT_CANDIDATE=NO' \
            out-t1/p1b-t1-gates.txt
          grep -Fxq 'T2_STATUS=DESIGNED' out-t1/p1b-t1-gates.txt
          grep -Fxq 'READY_FOR_DEVICE=NO' out-t1/p1b-t1-gates.txt
          grep -Eq '^T1_NEGATIVE_FIXTURE_COUNT=2[0-9]$' \
            out-t1/p1b-t1-negative-fixtures.txt

      - name: T1 observer fixtures
        env:
          GITHUB_ACTIONS: "true"
        run: |
          python3 scripts/r3-p1b/p1b-t1-predevice.py \
            --mode observer-fixtures --out out-t1
          grep -Fxq 'OBSERVER_T1_AST_DEADLOCK_GATE=PASS' \
            out-t1/p1b-t1-observer-fixtures.txt
          grep -Fxq 'OBSERVER_T1_IDENTITY_T0_BOOT_MISBOOT_REFUSED=PASS' \
            out-t1/p1b-t1-observer-fixtures.txt
          grep -Fxq 'OBSERVER_T1_IDENTITY_FIX8_BOOT_MISBOOT_REFUSED=PASS' \
            out-t1/p1b-t1-observer-fixtures.txt
          grep -Fxq 'OBSERVER_T1_IDENTITY_PANIC30_BOOT_MISBOOT_REFUSED=PASS' \
            out-t1/p1b-t1-observer-fixtures.txt
          grep -Fxq 'OBSERVER_T1_IDENTITY_EXACT_MATCH_ACCEPTED=PASS' \
            out-t1/p1b-t1-observer-fixtures.txt
          grep -Fxq 'OBSERVER_T1_DECODER_CASES_A_TO_F=PASS' \
            out-t1/p1b-t1-observer-fixtures.txt
          grep -Fxq 'OBSERVER_T1_SUMMARY_FIXTURE=PASS' \
            out-t1/p1b-t1-observer-fixtures.txt

      - name: Assert no device image was emitted
        shell: bash
        run: |
          set -euo pipefail
          if find . -name '*.img' -print -quit | grep -q .; then
            echo 'device image emitted' >&2
            exit 1
          fi
          echo 'PUBLIC_R3_P1B_T1_NO_DEVICE_IMAGE=PASS'
          echo 'DEVICE_OPERATION=NO'
          echo 'SLOT_A_WRITTEN=NO'

      - name: Stage T1 release inputs
        run: |
          mkdir -p out-t1-release
          cp out-t1/thyme-r3-p1b-t1-kernel-payload.bin out-t1-release/
          cp out-t1/p1b-t1-checkpoint.bin out-t1/p1b-t1-checkpoint.elf \
            out-t1/p1b-t1-checkpoint-disasm.txt out-t1-release/
          cp out-t1/p1b-t1-frozen-fix8-trampoline.bin \
            out-t1/p1b-t1-frozen-fix8-trampoline-disasm.txt out-t1-release/
          cp out-t1/p1b-t1-branch-patch-record-disasm.txt out-t1-release/
          cp out-t1/p1b-t1-original-insn-record-disasm.txt out-t1-release/
          cp out-t1/p1b-t1-primary-entry-vmlinux-disasm.txt out-t1-release/
          cp out-t1/p1b-t1-sysmap-excerpt.txt out-t1-release/
          cp out-t1/p1b-t1-payload-diff-report.txt out-t1-release/
          cp out-t1/p1b-t1-negative-fixtures.txt out-t1-release/
          cp out-t1/p1b-t1-decoder-fixtures.txt out-t1-release/
          cp out-t1/p1b-t1-observer-fixtures.txt out-t1-release/
          cp out-t1/p1b-t1-report.txt out-t1/p1b-t1-manifest.json \
            out-t1/p1b-t1-gates.txt out-t1-release/
          cp out-t1-run.txt out-t1-release/
          ( cd out-t1-release && sha256sum \
              thyme-r3-p1b-t1-kernel-payload.bin \
              p1b-t1-checkpoint.bin \
              p1b-t1-frozen-fix8-trampoline.bin \
              > SHA256SUMS )
          cat out-t1-release/SHA256SUMS

      - name: Upload T1 artifacts
        uses: actions/upload-artifact@v4
        with:
          name: thyme-r3-p1b-t1
          if-no-files-found: error
          path: out-t1-release/**

  verify:
    name: R3 P1B T1 independent re-verification
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    needs: t1-build
    steps:
      - name: Download this run artifacts
        env:
          GH_TOKEN: ${{ github.token }}
          RUN_ID: ${{ github.run_id }}
        run: |
          set -euo pipefail
          gh run download "$RUN_ID" \
            --repo "${{ github.repository }}" \
            --name thyme-r3-p1b-t1 --dir art
          ( cd art && sha256sum -c SHA256SUMS )
          echo 'ARTIFACT_SHA_RECHECK=PASS'

      - name: Download frozen FIX8 payload + RT-D again
        env:
          GH_TOKEN: ${{ github.token }}
          FIX8_RUN_ID: ${{ inputs.fix8_run_id || '34741153230' }}
          RT_D_RUN_ID: ${{ inputs.rt_d_run_id || '34678001413' }}
        run: |
          set -euo pipefail
          gh run download "$FIX8_RUN_ID" \
            --repo "${{ github.repository }}" \
            --name thyme-r3-p1b-fix8-fix24 --dir fix8
          printf '%s  fix8/thyme-r3-p1b-fix8-kernel-payload.bin\n' \
            4f34eabf670a735b3a10ebd0fb005e937faba881ea23fdc0843cf4ac96cceb41 \
            | sha256sum -c -
          gh run download "$RT_D_RUN_ID" \
            --repo "${{ github.repository }}" \
            --name thyme-r3-runtime-dtb --dir rt-d
          printf '%s  rt-d/rt-d.dtb\n' \
            4849743205af9d00f4b5bcd01070aac68be7dc60954975069356d29fe33df327 \
            | sha256sum -c -

      - name: Independent structured re-verification
        env:
          GITHUB_ACTIONS: "true"
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import hashlib, json, struct
          from pathlib import Path

          def sha(b): return hashlib.sha256(b).hexdigest()
          def sx(v, bits):
              m = 1 << bits
              return v - m if v & (m >> 1) else v
          def align(v, a): return (v + a - 1) // a * a

          t1 = Path("art/thyme-r3-p1b-t1-kernel-payload.bin").read_bytes()
          fix8 = Path("fix8/thyme-r3-p1b-fix8-kernel-payload.bin").read_bytes()
          rtd = Path("rt-d/rt-d.dtb").read_bytes()
          ckbin = Path("art/p1b-t1-checkpoint.bin").read_bytes()
          m = json.loads(Path("art/p1b-t1-manifest.json").read_text())

          if sha(t1) != m["t1_payload_sha256"]:
              raise SystemExit("T1_VERIFY_FAILED payload sha vs manifest")
          if len(t1) != 37369041 or len(fix8) != len(t1):
              raise SystemExit(f"T1_VERIFY_FAILED size {len(t1)}")
          if sha(ckbin) != m["t1_checkpoint_sha256"]:
              raise SystemExit("T1_VERIFY_FAILED checkpoint sha vs manifest")

          # Section 11: re-read image_size from the real headers (both the
          # frozen payload and the T1 payload), never from a document.
          isz_t1 = struct.unpack_from("<Q", t1, 16)[0]
          isz_fix8 = struct.unpack_from("<Q", fix8, 16)[0]
          if isz_t1 != isz_fix8 or isz_t1 <= 0:
              raise SystemExit(f"T1_VERIFY_FAILED image_size {isz_t1:#x}")
          dtb_off = align(isz_t1 + 0x80000, 0x200000) - 0x80000
          if dtb_off != 0x2380000:
              raise SystemExit(f"T1_VERIFY_FAILED dtb_offset {dtb_off:#x}")
          if struct.unpack_from("<I", t1, 4)[0] != 0x1400000F:
              raise SystemExit("T1_VERIFY_FAILED code1")

          off_primary = int(m["t1_primary_entry_offset"], 16)
          ck = int(m["t1_checkpoint_offset"], 16)
          plen = int(m["t1_checkpoint_size"])
          file_size = int(m["image_file_size"])
          if not (0x40 <= plen <= 0x80):
              raise SystemExit(f"T1_VERIFY_FAILED checkpoint size {plen}")
          # Sections 10/12: outside the Image file AND outside the image_size
          # runtime footprint, before the RT-D trailer.
          if ck < file_size:
              raise SystemExit("T1_VERIFY_FAILED checkpoint inside Image file")
          if ck < isz_t1:
              raise SystemExit(
                  f"T1_VERIFY_FAILED checkpoint {ck:#x} inside image_size "
                  f"footprint {isz_t1:#x}")
          if ck + plen > dtb_off:
              raise SystemExit("T1_VERIFY_FAILED checkpoint overlaps RT-D")
          base = max(file_size, isz_t1)
          if any(fix8[base:dtb_off]):
              raise SystemExit("T1_VERIFY_FAILED padding not zero in FIX8")

          # Diff attribution: primary_entry word + checkpoint region only.
          # The primary entry patch itself is the single 4-byte B.
          allowed = set(range(off_primary, off_primary + 4)) | \
                    set(range(ck, ck + plen))
          diffs = [i for i in range(len(fix8)) if fix8[i] != t1[i]]
          bad = [i for i in diffs if i not in allowed]
          if bad:
              raise SystemExit(f"T1_VERIFY_FAILED diff outside regions {bad[:8]}")
          if not any(off_primary <= i < off_primary + 4 for i in diffs):
              raise SystemExit("T1_VERIFY_FAILED primary_entry patch missing")
          if t1[ck:ck + plen] != ckbin:
              raise SystemExit("T1_VERIFY_FAILED checkpoint bytes")
          print(f"T1_VERIFY_DIFF_BYTE_COUNT={len(diffs)}")
          print(f"T1_VERIFY_DIFF_RANGES=[{off_primary:#x},{off_primary+4:#x}) "
                f"[{ck:#x},{ck+plen:#x})")
          print("T1_VERIFY_DIFF_ATTRIBUTION="
                "PRIMARY_ENTRY_PATCH_PLUS_CHECKPOINT_REGION_ONLY")

          # Trampoline identity (section 9): byte-identical to frozen FIX8.
          tramp = t1[0x40:0x70]
          if sha(tramp) != ("362d9c6e08863f79327364532372c6ecc9086e6211635e7fa4a6db4d"
                            "747dc623"):
              raise SystemExit("T1_VERIFY_FAILED trampoline != frozen FIX8")
          if tramp != fix8[0x40:0x70]:
              raise SystemExit("T1_VERIFY_FAILED trampoline bytes differ")
          tw = struct.unpack_from("<12I", tramp, 0)
          if (tw[8] >> 26) != 0b000101:
              raise SystemExit("T1_VERIFY_FAILED trampoline word[8] not B")
          if 0x40 + 0x20 + sx(tw[8] & 0x03FFFFFF, 26) * 4 != off_primary:
              raise SystemExit("T1_VERIFY_FAILED trampoline branch target")
          print("T1_VERIFY_TRAMPOLINE=FROZEN_FIX8_BYTE_IDENTICAL")

          # primary_entry patched to branch exactly onto the checkpoint.
          bw = struct.unpack_from("<I", t1, off_primary)[0]
          if (bw >> 26) != 0b000101:
              raise SystemExit("T1_VERIFY_FAILED patched word not B")
          if off_primary + sx(bw & 0x03FFFFFF, 26) * 4 != ck:
              raise SystemExit("T1_VERIFY_FAILED branch target != checkpoint")
          print(f"T1_VERIFY_BRANCH_DISTANCE={ck - off_primary:#x}")

          # Fail-closed terminal structure decoded from raw words.
          words = struct.unpack_from(f"<{plen // 4}I", ckbin, 0)
          smc = [i for i, w in enumerate(words) if w == 0xD4000003]
          if len(smc) != 1:
              raise SystemExit(f"T1_VERIFY_FAILED smc count {smc}")
          i = smc[0]
          if words[i + 1] != 0xD503205F:
              raise SystemExit("T1_VERIFY_FAILED no wfe after smc")
          w = words[i + 2]
          if (w >> 26) != 0b000101:
              raise SystemExit("T1_VERIFY_FAILED no branch after wfe")
          target = (i + 2) * 4 + sx(w & 0x03FFFFFF, 26) * 4
          if target != (i + 1) * 4:
              raise SystemExit(
                  f"T1_VERIFY_FAILED terminal b {target:#x} != wfe {(i+1)*4:#x}")
          # movz x10, #8 (the CNTPCT-scaled 8s delay word).
          if words[3] != 0xD280010A:
              raise SystemExit(f"T1_VERIFY_FAILED delay word {words[3]:#010x}")
          # No branch may leave the checkpoint, and no branch may target
          # primary_entry (no normal-kernel continuation exists).
          for idx, w in enumerate(words):
              addr = idx * 4
              top = w >> 26
              if top == 0b000101 or top == 0b100101:
                  t = addr + sx(w & 0x03FFFFFF, 26) * 4
              elif (w >> 24) == 0x54:
                  t = addr + sx((w >> 5) & 0x7FFFF, 19) * 4
              else:
                  continue
              if not (0 <= t < plen):
                  raise SystemExit(
                      f"T1_VERIFY_FAILED branch leaves checkpoint: "
                      f"{addr:#x} -> {t:#x}")
          print("T1_VERIFY_FAIL_CLOSED=SMC_WFE_LOOP_NO_PRIMARY_ENTRY")

          # RT-D trailer + geometry identity.
          if t1[dtb_off:] != rtd or sha(rtd) != (
                  "4849743205af9d00f4b5bcd01070aac68be7dc6095497506935"
                  "6d29fe33df327") or len(rtd) != 144593:
              raise SystemExit("T1_VERIFY_FAILED trailer != frozen RT-D")
          boot_est = (4096 + len(t1) + 4095) & ~4095
          boot_est += 4096
          if boot_est != 37380096:
              raise SystemExit(f"T1_VERIFY_FAILED boot_est {boot_est}")
          if 201326592 - boot_est < 0x1000000:
              raise SystemExit("T1_VERIFY_FAILED capacity")
          print(f"T1_VERIFY_IMAGE_HEADER_IMAGE_SIZE={isz_t1:#x}")
          print(f"T1_VERIFY_IMAGE_FILE_SIZE={file_size}")
          print(f"T1_VERIFY_CHECKPOINT_OFFSET={ck:#x} size={plen}")
          print(f"T1_VERIFY_PAYLOAD_SIZE={len(t1)} boot_size_est={boot_est}")
          print("T1_VERIFY_GATES=PASS")
          print("DEVICE_OPERATION=NO")
          print("READY_FOR_DEVICE=NO")
          PY

      - name: Assert constraints + assemble verdict
        shell: bash
        run: |
          set -euo pipefail
          if find . -name '*.img' -print -quit | grep -q .; then
            echo 'device image emitted' >&2
            exit 1
          fi
          {
            echo "MAINLINE_V2_R3_P1B_T1_PREDEVICE_READINESS_CI (CI ONLY)"
            echo "DEVICE_OPERATION=NO"
            echo "PARTITION_WRITES=0"
            echo "SLOT_A_WRITTEN=NO"
            echo "--- gates ---"
            cat art/p1b-t1-gates.txt
            echo "--- manifest ---"
            cat art/p1b-t1-manifest.json
          } > verdict.txt
          cat verdict.txt >> "$GITHUB_STEP_SUMMARY"
          echo 'T1_PREDEVICE_READINESS_CI_VERDICT=CI_PASS'
