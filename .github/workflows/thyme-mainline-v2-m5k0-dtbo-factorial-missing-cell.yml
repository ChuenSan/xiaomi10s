name: thyme-mainline-v2-m5k0-public-source-audit

# Public source only. Exact Stock/M1 inputs, DT parsing, DTBO transformation,
# normalized full-partition image generation, binary diff, fdtoverlay audit and
# fail-closed negative tests run only in the private auxiliary CI repo.
on:
  push:
    branches: [route-b-v3]
    paths:
      - '.github/workflows/thyme-mainline-v2-m5k0-dtbo-factorial-missing-cell.yml'
      - 'scripts/m5k0_dtbo_factorial_missing_cell.py'
      - 'docs/route-b-mainline-v2-m5k-dtbo-factorial-missing-cell.md'
  pull_request:
    paths:
      - '.github/workflows/thyme-mainline-v2-m5k0-dtbo-factorial-missing-cell.yml'
      - 'scripts/m5k0_dtbo_factorial_missing_cell.py'
      - 'docs/route-b-mainline-v2-m5k-dtbo-factorial-missing-cell.md'
  workflow_dispatch:

concurrency:
  group: thyme-mainline-v2-m5k0-public-source-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  source-audit:
    name: M5K0 public source audit (no OEM input)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - name: Lint workflow source
        uses: docker://rhysd/actionlint:latest
        with:
          args: -color .github/workflows/thyme-mainline-v2-m5k0-dtbo-factorial-missing-cell.yml

      - name: Parse public missing-cell script
        run: python3 -m py_compile scripts/m5k0_dtbo_factorial_missing_cell.py

      - name: Assert CI-only and public/private boundary
        shell: bash
        run: |
          set -euo pipefail
          script=scripts/m5k0_dtbo_factorial_missing_cell.py
          grep -Fq 'GITHUB_ACTIONS' "$script"
          grep -Fq 'GitHub Actions only' "$script"
          grep -Fq 'READY_FOR_MAINLINE_V2_M5K_DTBO_ONE_ENTRY_STOCK_PAYLOAD_CONTROL' "$script"
          grep -Fq 'M5K0_SOURCE_IDENTITY_FAILED' "$script"
          grep -Fq 'M5K0_D_CONTROL2_IDENTITY_FAILED' "$script"
          grep -Fq 'M5K0_D_CONTROL2_CONTAINER_INVALID' "$script"
          grep -Fq 'M5K0_D_CONTROL2_PAYLOAD_INVALID' "$script"
          grep -Fq 'M5K0_D_CONTROL2_TAIL_NORMALIZATION_FAILED' "$script"
          grep -Fq 'M5K0_D_CONTROL2_NOT_SAFE' "$script"
          grep -Fq 'M5K0_FULL_ARTIFACT_SIZE' "$script"
          grep -Fq 'M5J_NOOP_RESIDUE_IN_TAIL=NO' "$script"
          grep -Fq 'ONE_ENTRY_CONTAINER_ALONE_SUFFICIENT=NO' "$script"
          test ! -e MIUI14ROM/image/vendor_boot.img
          test ! -e MIUI14ROM/image/dtbo.img
          if git ls-files | grep -Ei '(^|/)(vendor_boot|dtbo)\.img$'; then
            echo 'tracked OEM or hybrid binary found' >&2
            exit 1
          fi
          if git ls-files | grep -Ei '(^|/)m5k0-full-normalized-dtbo\.img$'; then
            echo 'tracked M5K0 OEM-derived artifact found' >&2
            exit 1
          fi
          echo 'PUBLIC_M5K0_SOURCE_ONLY=PASS'
