name: thyme-slot-b-core-observer-fixtures

on:
  push:
    branches: [route-b-slot-b-continuation]
    paths:
      - scripts/slot_b/observe.py
      - scripts/slot_b/test_observe.py
      - scripts/slot_b/core_observer_fixtures.py
      - .github/workflows/thyme-slot-b-core-observer-fixtures.yml
  pull_request:
    paths:
      - scripts/slot_b/observe.py
      - scripts/slot_b/test_observe.py
      - scripts/slot_b/core_observer_fixtures.py
      - .github/workflows/thyme-slot-b-core-observer-fixtures.yml
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: thyme-slot-b-core-observer-fixtures-${{ github.ref }}
  cancel-in-progress: true

jobs:
  core-observer-fixtures:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          clean: false
          persist-credentials: false
      - name: GHA-only observer source and fixture tests
        env:
          GITHUB_ACTIONS: 'true'
        run: |
          set -euo pipefail
          python3 -m py_compile scripts/slot_b/observe.py \
            scripts/slot_b/test_observe.py scripts/slot_b/core_observer_fixtures.py
          (cd scripts/slot_b && python3 -B -m unittest test_observe.py -v) \
            2>&1 | tee core-observer-unit-tests.log
          (cd scripts/slot_b && python3 -B core_observer_fixtures.py) \
            | tee core-observer-fixtures.txt
          for gate in \
            CORE8_OBSERVER_READY=YES \
            CORE1_OBSERVER_READY=YES \
            CORE_PAIR_OBSERVER_FIXTURES=PASS \
            CORE_PAIR_DEVICE_EXECUTION_SPLIT=REQUIRED \
            SECOND_BOOT_FORBIDDEN=PASS \
            RAM_BOOT_ONLY=PASS \
            MANUAL_RECOVERY_TIMING_NOT_PROOF=PASS; do
            grep -Fxq "$gate" core-observer-fixtures.txt
          done
          printf '%s\n' \
            'CORE8_OBSERVER_FULL_SHA_GATE=PASS' \
            'CORE1_OBSERVER_FULL_SHA_GATE=PASS' \
            'CORE_PAIR_OBSERVER_FIXTURES=PASS' \
            'DEVICE_OPERATION=NO' \
            'ADB_DEVICE_OPERATION=NO' \
            'FASTBOOT_DEVICE_OPERATION=NO' \
            'PARTITION_WRITES=0' \
            'SLOT_A_WRITTEN=NO' \
            | tee core-observer-gates.txt
      - uses: actions/upload-artifact@v4
        with:
          name: thyme-slot-b-core-observer-fixtures
          path: |
            core-observer-unit-tests.log
            core-observer-fixtures.txt
            core-observer-gates.txt
          if-no-files-found: error
          retention-days: 90
