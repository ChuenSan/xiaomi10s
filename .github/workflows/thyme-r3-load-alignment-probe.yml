name: thyme-r3-load-alignment-probe

# Public CI for the R3 load-alignment probe.
# Assembles the probe for disassembly gates but does not splice M5D and does
# not emit a boot image. Flashable packing runs in private GHA:
#   ChuenSan/thyme-mainline-private-ci  thyme-r3-load-alignment-probe.yml
on:
  push:
    branches: [route-b-v3]
    paths:
      - '.github/workflows/thyme-r3-load-alignment-probe.yml'
      - 'docs/route-r3-load-alignment-probe-ci.md'
      - 'scripts/r3-lap/**'
  pull_request:
    paths:
      - '.github/workflows/thyme-r3-load-alignment-probe.yml'
      - 'docs/route-r3-load-alignment-probe-ci.md'
      - 'scripts/r3-lap/**'
  workflow_dispatch:

concurrency:
  group: thyme-r3-load-alignment-probe-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  LLVM_PKG: "1:18.1.3-1ubuntu1"
  LLVM_VERSION: "18.1.3"

jobs:
  source-audit:
    name: R3 LAP public source audit
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Checkout public source
        uses: actions/checkout@v4

      - name: Lint workflow in Actions
        uses: docker://rhysd/actionlint:latest
        with:
          args: -color .github/workflows/thyme-r3-load-alignment-probe.yml

      - name: Parse probe and observer scripts
        run: |
          python3 -m py_compile scripts/r3-lap/load-alignment-probe.py
          python3 -m py_compile scripts/r3-lap/observe-r3-load-alignment.py
          python3 -m py_compile scripts/r3-lap/observer-summary-fixtures.py

      - name: LAP source-gate
        env:
          GITHUB_ACTIONS: "true"
        run: python3 scripts/r3-lap/load-alignment-probe.py --mode source-gate

      - name: Assert this workflow cannot emit a flashable boot
        shell: bash
        run: |
          set -euo pipefail
          wf=.github/workflows/thyme-r3-load-alignment-probe.yml
          grep -Fq 'Does not splice M5D and does not emit a boot image' "$wf"
          if git ls-files | grep -Ei '(^|/)(r3-lap|load-alignment).*\.(img|bin|elf)$'; then
            echo 'tracked lap probe binary found' >&2
            exit 1
          fi
          echo 'PUBLIC_R3_LAP_SOURCE_ONLY=PASS'
          echo 'DEVICE_OPERATION=NO'
          echo 'READY_FOR_DEVICE=NO'

  lap-gates:
    name: R3 LAP decoder fixtures + assemble gates (no boot image)
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    needs: source-audit
    steps:
      - name: Checkout public source
        uses: actions/checkout@v4

      - name: Install pinned LLVM 18.1.3
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo apt-get install -y \
            "clang-18=${LLVM_PKG}" \
            "lld-18=${LLVM_PKG}" \
            "llvm-18=${LLVM_PKG}"
          clang-18 --version | head -1
          ld.lld-18 --version | head -1
          echo "TOOLCHAIN_PINNED=clang-18=${LLVM_PKG}"

      - name: Decoder fixtures
        env:
          GITHUB_ACTIONS: "true"
        run: python3 scripts/r3-lap/load-alignment-probe.py --mode decoder-fixtures

      - name: Observer summary-path fixtures
        env:
          GITHUB_ACTIONS: "true"
        run: python3 scripts/r3-lap/observer-summary-fixtures.py

      - name: Assemble and gate the probe (no M5D, no boot image)
        env:
          GITHUB_ACTIONS: "true"
        run: |
          set -euo pipefail
          python3 scripts/r3-lap/load-alignment-probe.py \
            --mode assemble-gates \
            --out out-r3-lap \
            --clang clang-18 \
            --lld ld.lld-18 \
            --objcopy llvm-objcopy-18 \
            --objdump llvm-objdump-18 \
            --readelf llvm-readelf-18 \
            | tee out-r3-lap-run.txt
          grep -Fxq 'LAP_DISASM_GATES=PASS' out-r3-lap/r3-load-alignment-probe-gates.txt
          grep -Fxq 'LAP_IMAGE_BASE_PC_RELATIVE=PASS' out-r3-lap/r3-load-alignment-probe-gates.txt
          grep -Fxq 'ELF_RELOCATIONS=0' out-r3-lap/r3-load-alignment-probe-gates.txt
          grep -Fxq 'BOOT_ENVELOPE_FIXTURES=PASS' out-r3-lap/r3-load-alignment-probe-gates.txt
          grep -Fxq 'FAIL_CLOSED=PASS' out-r3-lap/r3-load-alignment-probe-gates.txt
          grep -Fxq 'NEGATIVE_TESTS_PASS=YES' out-r3-lap/r3-load-alignment-probe-gates.txt

      - name: Assert no flashable output exists
        shell: bash
        run: |
          set -euo pipefail
          if find . -name '*.img' -print -quit | grep -q .; then
            echo 'flashable image emitted' >&2
            exit 1
          fi
          echo 'PUBLIC_R3_LAP_NO_BOOT_IMAGE=PASS'
          echo 'DEVICE_OPERATION=NO'

      - name: Upload probe gate reports (text only)
        uses: actions/upload-artifact@v4
        with:
          name: thyme-r3-lap-probe-gates
          path: |
            out-r3-lap/r3-load-alignment-probe-gates.txt
            out-r3-lap/r3-lap-probe-disasm.txt
            out-r3-lap/r3-lap-neg-*-disasm.txt
          if-no-files-found: error
