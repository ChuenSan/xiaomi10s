name: thyme-mainline-v2-m5g-public-source-audit

# Public source only. Exact Stock/M1 inputs, DT parsing, binary transformation,
# validation, and flashable controls run only in the private auxiliary CI repo.
on:
  push:
    branches: [route-b-v3]
    paths:
      - '.github/workflows/thyme-mainline-v2-m5g-dt-packaging-component-audit.yml'
      - 'scripts/m5g_dt_packaging_audit.py'
      - 'docs/route-b-mainline-v2-m5g-dt-packaging-component-audit.md'
  pull_request:
    paths:
      - '.github/workflows/thyme-mainline-v2-m5g-dt-packaging-component-audit.yml'
      - 'scripts/m5g_dt_packaging_audit.py'
      - 'docs/route-b-mainline-v2-m5g-dt-packaging-component-audit.md'
  workflow_dispatch:

concurrency:
  group: thyme-mainline-v2-m5g-public-source-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  source-audit:
    name: M5G public source audit (no OEM input)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - name: Lint workflow source
        uses: docker://rhysd/actionlint:latest
        with:
          args: -color .github/workflows/thyme-mainline-v2-m5g-dt-packaging-component-audit.yml

      - name: Parse public audit script
        run: python3 -m py_compile scripts/m5g_dt_packaging_audit.py

      - name: Assert CI-only and public/private boundary
        shell: bash
        run: |
          set -euo pipefail
          grep -Fq 'GITHUB_ACTIONS' scripts/m5g_dt_packaging_audit.py
          grep -Fq 'GitHub Actions only' scripts/m5g_dt_packaging_audit.py
          grep -Fq 'READY_FOR_M5G_V_SINGLE_STOCK_DTB_CONTROL' scripts/m5g_dt_packaging_audit.py
          grep -Fq 'READY_FOR_M5G_D_STOCK_TABLE_M1_PAYLOAD_CONTROL' scripts/m5g_dt_packaging_audit.py
          test ! -e MIUI14ROM/image/vendor_boot.img
          test ! -e MIUI14ROM/image/dtbo.img
          if git ls-files | grep -Ei '(^|/)(vendor_boot|dtbo)\.img$'; then
            echo 'tracked OEM or hybrid binary found' >&2
            exit 1
          fi
          echo 'PUBLIC_M5G_SOURCE_ONLY=PASS'
