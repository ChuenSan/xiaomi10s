name: thyme-slot-b-kernel-init

on:
  push:
    branches: [route-b-slot-b-continuation]
    paths:
      - 'scripts/slot_b/checkpoint*'
      - 'scripts/slot_b/test_checkpoint.py'
      - '.github/workflows/thyme-slot-b-kernel-init.yml'
  workflow_dispatch:
    inputs:
      symbol:
        description: Audited PID1 stage, built from the frozen normal payload
        type: choice
        options: [kernel_init_freeable, smp_init, kernel_init, do_basic_setup]
        default: kernel_init_freeable

permissions:
  contents: read
  actions: read

jobs:
  audit-pair:
    if: github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    env:
      CHECKPOINT_SYMBOL: ${{ inputs.symbol || 'kernel_init_freeable' }}
    steps:
      - uses: actions/checkout@v4
        with:
          clean: false
          persist-credentials: false
      - name: Source and guard tests
        run: python3 -B -m unittest discover -s scripts/slot_b -p 'test_*.py' -v
      - name: Install binary inspection tools and diagnostic assembler
        run: |
          sudo apt-get update
          sudo apt-get install -y llvm-18 clang-18
      - name: Reuse pinned kernel audit bundle and immutable payload
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          gh run download 35040148509 -R "$GITHUB_REPOSITORY" -n thyme-slot-b-kernel-audit-bundle -D kernel-bundle
          gh run download 34741153230 -R "$GITHUB_REPOSITORY" -n thyme-r3-p1b-fix8-fix24 -D frozen
          gh run download 34980859158 -R "$GITHUB_REPOSITORY" -n thyme-r3-p1b-reset-pair -D proven-core
      - name: Assemble compact diagnostic for independent byte agreement
        run: |
          set -euo pipefail
          clang-18 --target=aarch64-linux-gnu -c scripts/slot_b/checkpoint-compact.S -o compact.o
          llvm-readelf-18 -r compact.o | tee kernel-init-compact-relocations.log
          grep -q 'There are no relocations in this file' kernel-init-compact-relocations.log
          llvm-objcopy-18 -O binary --only-section=.text compact.o compact.bin
          llvm-objdump-18 -d compact.o | tee kernel-init-compact-disassembly.log
      - name: Audit selected PID1 stage and compose matched pair
        run: |
          set -euo pipefail
          for delay in 8 1; do
            reference=()
            if [ "$delay" = 1 ]; then
              reference=(--reference-sha "$(jq -r .payload_sha256 out-pair/8/checkpoint/manifest.json)")
            fi
            python3 -u -B scripts/slot_b/checkpoint.py \
              --symbol "$CHECKPOINT_SYMBOL" --delay "$delay" --compact-core compact.bin \
              --bundle kernel-bundle \
              --frozen frozen/thyme-r3-p1b-fix8-kernel-payload.bin \
              --core proven-core/p1b-t1-core-reference.bin \
              --out "out-pair/$delay" "${reference[@]}" | tee "kernel-init-$delay.log"
          done
          python3 -B - <<'PY'
          import json, os
          from pathlib import Path
          root = Path('out-pair')
          a = json.loads((root/'8/checkpoint/manifest.json').read_text())
          b = json.loads((root/'1/checkpoint/manifest.json').read_text())
          p8 = (root/'8/checkpoint/payload.bin').read_bytes()
          p1 = (root/'1/checkpoint/payload.bin').read_bytes()
          symbol = os.environ['CHECKPOINT_SYMBOL']
          targets = {'kernel_init': 0x10c2030, 'kernel_init_freeable': 0x1b3103c,
                     'smp_init': 0x1b466e0, 'do_basic_setup': 0x1b311a8}
          assert a['symbol'] == b['symbol'] == symbol
          assert a['delay_seconds'] == 8 and b['delay_seconds'] == 1
          assert a['offset'] == b['offset'] == targets[symbol]
          assert a['checkpoint_size'] == b['checkpoint_size'] == 72
          assert a['core_variant'] == b['core_variant'] == 'compact_b_lo'
          assert len(p8) == len(p1) == a['payload_size'] == b['payload_size']
          changed = [i for i, (x, y) in enumerate(zip(p8, p1)) if x != y]
          assert changed == [a['offset'] + 16, a['offset'] + 17]
          assert b['pair_reference_sha256'] == a['payload_sha256']
          pair = {'symbol': symbol, 'source_commit': os.environ['GITHUB_SHA'],
                  'public_run': os.environ['GITHUB_RUN_ID'], 'bundle_run': '35040148509',
                  'payload_shas': {'8': a['payload_sha256'], '1': b['payload_sha256']},
                  'changed_offsets': changed, 'expected_delta_s': -7,
                  'device_operation': False, 'kernel_rebuilt': False}
          (root/'pair.json').write_text(json.dumps(pair, indent=2)+'\n')
          print(json.dumps(pair, indent=2))
          print('KERNEL_INIT_PAIR_AUDIT=PASS')
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: thyme-slot-b-checkpoint-pair
          path: out-pair/
          if-no-files-found: error
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: thyme-slot-b-kernel-init-logs
          path: |
            kernel-init-*.log
            out-pair/*/checkpoint/original-window.txt
            out-pair/*/checkpoint/original-function.txt
            out-pair/*/checkpoint/window-agreement.json
          if-no-files-found: warn
