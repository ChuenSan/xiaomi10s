name: thyme-slot-b-subsys-observer-fixtures

on:
  push:
    branches: [route-b-slot-b-continuation]
    paths:
      - scripts/slot_b/observe.py
      - scripts/slot_b/test_observe.py
      - scripts/slot_b/subsys_observer_fixtures.py
      - .github/workflows/thyme-slot-b-subsys-observer-fixtures.yml
  pull_request:
    paths:
      - scripts/slot_b/observe.py
      - scripts/slot_b/test_observe.py
      - scripts/slot_b/subsys_observer_fixtures.py
      - .github/workflows/thyme-slot-b-subsys-observer-fixtures.yml
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: thyme-slot-b-subsys-observer-fixtures-${{ github.ref }}
  cancel-in-progress: true

jobs:
  subsys-observer-fixtures:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          clean: false
          persist-credentials: false
      - name: GHA-only observer source and fixture tests
        env:
          GITHUB_ACTIONS: 'true'
        run: |
          set -euo pipefail
          python3 -m py_compile scripts/slot_b/observe.py \
            scripts/slot_b/test_observe.py scripts/slot_b/subsys_observer_fixtures.py
          (cd scripts/slot_b && python3 -B -m unittest test_observe.py -v) \
            2>&1 | tee subsys-observer-unit-tests.log
          (cd scripts/slot_b && python3 -B subsys_observer_fixtures.py) \
            | tee subsys-observer-fixtures.txt
          for gate in \
            SUBSYS8_OBSERVER_READY=YES \
            SUBSYS1_OBSERVER_READY=YES \
            SUBSYS_PAIR_OBSERVER_FIXTURES=PASS \
            SUBSYS_56B_GEOMETRY_GATE=PASS \
            SUBSYS_52B_CORE_GATE=PASS \
            SUBSYS_60B_NEGATIVE_FIXTURE=PASS \
            SUBSYS_57B_NEGATIVE_FIXTURE=PASS \
            FIRST_FS_PREL32_TARGET_UNCHANGED=YES \
            SUBSYS_PAIR_DEVICE_EXECUTION_SPLIT=REQUIRED \
            SUBSYS_PAIR_EXECUTION_ORDER=SUBSYS8_THEN_SUBSYS1 \
            SUBSYS_FUTURE_PAIR_BOUNDARIES=PASS \
            SECOND_BOOT_FORBIDDEN=PASS \
            RAM_BOOT_ONLY=PASS \
            MANUAL_RECOVERY_TIMING_NOT_PROOF=PASS; do
            grep -Fxq "$gate" subsys-observer-fixtures.txt
          done
          printf '%s\n' \
            'SUBSYS8_OBSERVER_FULL_SHA_GATE=PASS' \
            'SUBSYS1_OBSERVER_FULL_SHA_GATE=PASS' \
            'SUBSYS_56B_GEOMETRY_GATE=PASS' \
            'SUBSYS_60B_NEGATIVE_FIXTURE=PASS' \
            'SUBSYS_52B_CORE_GATE=PASS' \
            'SUBSYS_PAIR_OBSERVER_FIXTURES=PASS' \
            'DEVICE_OPERATION=NO' \
            'ADB_DEVICE_OPERATION=NO' \
            'FASTBOOT_DEVICE_OPERATION=NO' \
            'PARTITION_WRITES=0' \
            'SLOT_A_WRITTEN=NO' \
            | tee subsys-observer-gates.txt
      - uses: actions/upload-artifact@v4
        with:
          name: thyme-slot-b-subsys-observer-fixtures
          path: |
            subsys-observer-unit-tests.log
            subsys-observer-fixtures.txt
            subsys-observer-gates.txt
          if-no-files-found: error
          retention-days: 90
