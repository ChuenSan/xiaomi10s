name: thyme-stock-kernel-usb-stage4-http

# Isolated: official V14 stock 4.19 kernel + static PID1 that reuses the
# verified USB/NCM/L3 path and adds only an explicit TCP/HTTP listener.
# The listener is bound to 10.66.73.1:8080 and serves for a bounded 60s.
on:
  push:
    branches: [route-b-v3]
  workflow_dispatch:
    inputs:
      stock_boot_url:
        description: Optional HTTPS URL to official V14.0.6.0.TGACNXM boot.img
        required: false
        type: string

concurrency:
  group: thyme-stock-kernel-usb-stage4-http-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: write
  actions: write

env:
  RELEASE_DIR: out-release
  BUILD_MARKER: ${{ github.sha }}
  STOCK_BOOT_SHA256: 9d8c12c529b3df74ab8eea68b15e4284a2b1fa0c4d4c5572b986df9d9ce3e9be
  STOCK_BOOT_RELEASE_TAG: stock-V14.0.6.0.TGACNXM-boot
  BOOT_CAP: "201326592"

jobs:
  artifacts:
    name: stock kernel USB Stage4 HTTP (gating)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout project
        uses: actions/checkout@v4

      - name: Vendor AOSP boot tools sanity
        run: |
          python3 -c "import ast; ast.parse(open('tools/aosp/mkbootimg.py').read()); ast.parse(open('tools/aosp/unpack_bootimg.py').read()); print('aosp tools parse OK')"

      - name: Install toolchain (aarch64 gcc only; no kernel, no BusyBox)
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            gcc file python3 cpio gzip \
            gcc-aarch64-linux-gnu binutils-aarch64-linux-gnu
          echo "aarch64-gcc: $(aarch64-linux-gnu-gcc --version | head -1)"

      - name: Fetch official stock boot.img
        env:
          GH_TOKEN: ${{ github.token }}
          INPUT_URL: ${{ inputs.stock_boot_url }}
          VAR_URL: ${{ vars.STOCK_BOOT_IMG_URL }}
          SECRET_URL: ${{ secrets.STOCK_BOOT_IMG_URL }}
        run: |
          set -euo pipefail
          mkdir -p "$RELEASE_DIR"
          dest="$RELEASE_DIR/stock-boot.img"
          try_url() {
            local url="$1"
            [ -n "$url" ] || return 1
            echo "fetching $url"
            curl -fL --retry 3 -o "$dest.partial" "$url" || return 1
            mv "$dest.partial" "$dest"
          }
          if try_url "$INPUT_URL"; then
            echo "source=workflow_dispatch"
          elif try_url "$VAR_URL"; then
            echo "source=repo var"
          elif try_url "$SECRET_URL"; then
            echo "source=repo secret"
          else
            echo "source=draft/release $STOCK_BOOT_RELEASE_TAG"
            asset_id=$(gh api "repos/${{ github.repository }}/releases" \
              --jq ".[] | select(.tag_name==\"$STOCK_BOOT_RELEASE_TAG\") | .assets[] | select(.name==\"boot.img\") | .id" \
              | head -n1)
            if [ -z "$asset_id" ]; then
              echo "FAIL: official V14 boot.img not reachable." >&2
              echo "Provide workflow_dispatch stock_boot_url, repository variable/secret STOCK_BOOT_IMG_URL, or the draft release asset." >&2
              exit 1
            fi
            echo "asset_id=$asset_id"
            curl -fL --retry 3 \
              -H "Authorization: Bearer $GH_TOKEN" \
              -H "Accept: application/octet-stream" \
              -H "X-GitHub-Api-Version: 2022-11-28" \
              "https://api.github.com/repos/${{ github.repository }}/releases/assets/${asset_id}" \
              -o "$dest"
          fi
          test -s "$dest"
          echo "stock-boot.img bytes=$(wc -c < "$dest")"

      - name: Source logic gates
        run: python3 scripts/stock-kernel-usb-stage4-http-source-gates.py

      - name: Unit-validate canonical HTTP response
        run: python3 scripts/validate-stage4-http-response.py "${GITHUB_SHA:0:7}"

      - name: Build static usb-stage4-http-init + ramdisk
        run: |
          bash initramfs/build-usb-stage4-http.sh "$PWD/out-usb-stage4-http"
          python3 initramfs/verify-init-proof-elf.py out-usb-stage4-http/usb-stage4-http-init
          file out-usb-stage4-http/usb-stage4-http-init

      - name: Pack + reverse-validate boot v3
        run: |
          bash scripts/stock-kernel-usb-stage4-http-ci-validate.sh \
            "$PWD/$RELEASE_DIR" \
            "$PWD/$RELEASE_DIR/stock-boot.img" \
            "$PWD/out-usb-stage4-http"
          grep -q READY_FOR_USB_STAGE4_HTTP "$RELEASE_DIR/validation-report.txt"
          grep -q "STOCK_KERNEL_EXACT" "$RELEASE_DIR/validation-report.txt"
          grep -q "STAGE2_USB_NETWORK_CORE_REUSED PASS" "$RELEASE_DIR/validation-report.txt"
          grep -q "DEVICE_IP_LITERAL = 10.66.73.1" "$RELEASE_DIR/validation-report.txt"
          grep -q "HTTP_BIND_IP = 10.66.73.1" "$RELEASE_DIR/validation-report.txt"
          grep -q "HTTP_PORT = 8080" "$RELEASE_DIR/validation-report.txt"
          grep -q "HTTP_RESPONSE_200_PRESENT PASS" "$RELEASE_DIR/validation-report.txt"
          grep -q "CONTENT_LENGTH_VALIDATION PASS" "$RELEASE_DIR/validation-report.txt"
          grep -q "HTTP_READY_MARKER PASS" "$RELEASE_DIR/validation-report.txt"
          grep -q "NO_HTTP_EMPTY_REPLY_PATH PASS" "$RELEASE_DIR/validation-report.txt"
          grep -q "NO_INADDR_ANY_HTTP_BIND PASS" "$RELEASE_DIR/validation-report.txt"
          grep -q "NO_DHCP PASS" "$RELEASE_DIR/validation-report.txt"
          grep -q "NO_DEFAULT_ROUTE PASS" "$RELEASE_DIR/validation-report.txt"
          grep -q "FAILSAFE_RESTART2 PASS" "$RELEASE_DIR/validation-report.txt"
          test ! -e "$RELEASE_DIR/experimental-vendor_boot-v3.img"
          test ! -e "$RELEASE_DIR/experimental-dtbo.img"
          test ! -e "$RELEASE_DIR/vendor_boot.img"
          test ! -e "$RELEASE_DIR/dtbo.img"
          test ! -e "$RELEASE_DIR/vbmeta.img"
          test ! -e "$RELEASE_DIR/stock-kernel-usb-stage2-device-ip-boot-v3.img"

      - name: Generate SHA256SUMS
        run: |
          ( cd "$RELEASE_DIR" && sha256sum \
              stock-kernel-usb-stage4-http-boot-v3.img \
              usb-stage4-http-init \
              initramfs.cpio.gz \
              validation-report.txt \
              > SHA256SUMS )
          cat "$RELEASE_DIR/SHA256SUMS"

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: thyme-stock-kernel-usb-stage4-http-${{ github.sha }}
          if-no-files-found: error
          path: |
            out-release/stock-kernel-usb-stage4-http-boot-v3.img
            out-release/usb-stage4-http-init
            out-release/initramfs.cpio.gz
            out-release/SHA256SUMS
            out-release/unpack-report/**
            out-release/validation-report.txt
