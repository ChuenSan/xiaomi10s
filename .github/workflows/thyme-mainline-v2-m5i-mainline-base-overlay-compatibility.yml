name: thyme-mainline-v2-m5i-public-source-audit

# Public source only. DTB builds, DTC/fdtoverlay work, binary validation, merged
# Stock-derived DTBs, and hybrid vendor_boot artifacts stay in private GHA.
on:
  push:
    branches: [route-b-v3]
    paths:
      - '.github/workflows/thyme-mainline-v2-m5i-mainline-base-overlay-compatibility.yml'
      - 'scripts/m5i_overlay_compatibility.py'
      - 'docs/route-b-mainline-v2-m5i-mainline-base-overlay-compatibility.md'
  pull_request:
    paths:
      - '.github/workflows/thyme-mainline-v2-m5i-mainline-base-overlay-compatibility.yml'
      - 'scripts/m5i_overlay_compatibility.py'
      - 'docs/route-b-mainline-v2-m5i-mainline-base-overlay-compatibility.md'
  workflow_dispatch:

concurrency:
  group: thyme-mainline-v2-m5i-public-source-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  source-audit:
    name: M5I public source audit (no DTB or OEM build)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - name: Lint workflow source
        uses: docker://rhysd/actionlint:latest
        with:
          args: -color .github/workflows/thyme-mainline-v2-m5i-mainline-base-overlay-compatibility.yml

      - name: Parse public CI analyzer
        run: python3 -m py_compile scripts/m5i_overlay_compatibility.py

      - name: Assert CI-only boundary and gates
        shell: bash
        run: |
          set -euo pipefail
          script=scripts/m5i_overlay_compatibility.py
          grep -Fq 'GITHUB_ACTIONS' "$script"
          grep -Fq 'GitHub Actions only' "$script"
          grep -Fq 'M5I_BASELINE_M1_RAW_DTB_REPRODUCED' "$script"
          grep -Fq 'M5I_BASELINE_M1_ABL_DTB_REPRODUCED' "$script"
          grep -Fq 'M5I_M1_SOURCE_REPRODUCTION_FAILED' "$script"
          grep -Fq 'M5I_SYMBOLIZED_OVERLAY_STILL_INCOMPATIBLE' "$script"
          grep -Fq 'M5I_SYMBOLIZED_BUILD_SEMANTICS_CHANGED' "$script"
          grep -Fq 'M5I_CANDIDATE_NOT_SAFE' "$script"
          grep -Fq 'READY_FOR_MAINLINE_V2_M5I_SYMBOLIZED_BASE_CONTROL' "$script"
          grep -Fq 'OVERLAY_COMPATIBLE_DTC_METADATA' "$script"
          grep -Fq 'EXPECTED_STOCK_VENDOR_TAIL_SHA_FROM_M5I_EXTENT' "$script"
          grep -Fq 'DEVICE_OPERATION=NO' "$script"
          test ! -e MIUI14ROM/image/vendor_boot.img
          test ! -e MIUI14ROM/image/dtbo.img
          if git ls-files | grep -Ei '(^|/)(vendor_boot|dtbo)\.img$'; then
            echo 'tracked OEM or hybrid binary found' >&2
            exit 1
          fi
          if git ls-files | grep -Ei 'm5i-.*\.(dtb|dtbo|img)$'; then
            echo 'tracked M5I binary found' >&2
            exit 1
          fi
          echo 'PUBLIC_M5I_SOURCE_ONLY=PASS'
          echo 'DEVICE_OPERATION=NO'
          echo 'LOCAL_BUILD=NO'
