name: thyme-slot-b-fs-rootfs-return-observer-fixtures

on:
  push:
    branches: [route-b-slot-b-continuation]
    paths:
      - scripts/slot_b/observe.py
      - scripts/slot_b/test_observe.py
      - scripts/slot_b/rootfs_return_isolation.py
      - scripts/slot_b/fs_rootfs_return_observer_fixtures.py
      - .github/workflows/thyme-slot-b-fs-rootfs-return-observer-fixtures.yml
  pull_request:
    paths:
      - scripts/slot_b/observe.py
      - scripts/slot_b/test_observe.py
      - scripts/slot_b/rootfs_return_isolation.py
      - scripts/slot_b/fs_rootfs_return_observer_fixtures.py
      - .github/workflows/thyme-slot-b-fs-rootfs-return-observer-fixtures.yml
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: thyme-slot-b-fs-rootfs-return-observer-fixtures-${{ github.ref }}
  cancel-in-progress: true

jobs:
  observer-fixtures:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          clean: false
          persist-credentials: false
      - name: Lint workflow
        uses: docker://rhysd/actionlint:latest
        with:
          args: -color .github/workflows/thyme-slot-b-fs-rootfs-return-observer-fixtures.yml
      - name: GHA-only PUBLIC observer fixtures
        env:
          GITHUB_ACTIONS: 'true'
        run: |
          set -euo pipefail
          python3 -m py_compile scripts/slot_b/observe.py \
            scripts/slot_b/rootfs_return_isolation.py \
            scripts/slot_b/fs_rootfs_return_observer_fixtures.py
          (cd scripts/slot_b && python3 -B fs_rootfs_return_observer_fixtures.py) \
            | tee fs-rootfs-return-observer-fixtures.txt
          for gate in \
            P1_REMAINING=48 \
            P2_REMAINING=16 \
            P1_FITS_52=NO \
            P2_FITS_52=NO \
            INITRAMFS_ASYNC_DEFAULT=TRUE \
            WAIT_PATH_LIVE_ON_THYME=NO \
            ISLAND_PERMITTED=NO \
            TRAMPOLINE_PERMITTED=NO \
            SHARED_DO_INITCALL_LEVEL=NO \
            PAIR_GENERATED=NO \
            FIRST_DEVICE_SHIFT_NOT_OBSERVED_DOES_NOT_PROVE_NON_RETURN=YES \
            FS_INITCALLS_COMPLETED=NOT_PROVEN \
            FIRST_DEVICE_INITCALL_ENTRY=NOT_PROVEN \
            POPULATE_ROOTFS_ENTRY=PROVEN \
            POST51_STRONG_STILL_ONLY_ENTRY=PASS \
            FS_ROOTFS_RETURN_OBSERVER_FIXTURES=PASS \
            DEVICE_OPERATION=NO; do
            grep -Fxq "$gate" fs-rootfs-return-observer-fixtures.txt
          done
          printf '%s\n' \
            'FS_ROOTFS_RETURN_OBSERVER_GATES=PASS' \
            'DEVICE_OPERATION=NO' \
            'PARTITION_WRITES=0' \
            'SLOT_A_WRITTEN=NO' \
            | tee fs-rootfs-return-observer-gates.txt
      - uses: actions/upload-artifact@v4
        with:
          name: thyme-slot-b-fs-rootfs-return-observer-fixtures
          path: |
            fs-rootfs-return-observer-fixtures.txt
            fs-rootfs-return-observer-gates.txt
          if-no-files-found: error
          retention-days: 90
