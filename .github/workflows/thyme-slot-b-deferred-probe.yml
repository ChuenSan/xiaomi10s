name: Slot B deferred-probe callsite audit

on:
  push:
    branches: [route-b-slot-b-continuation]
    paths:
      - 'scripts/slot_b/deferred_probe_checkpoints.py'
      - 'scripts/slot_b/test_deferred_probe_checkpoints.py'
      - '.github/workflows/thyme-slot-b-deferred-probe.yml'
  workflow_dispatch:
    inputs:
      stage:
        description: Fixed scoped diagnostic target
        type: choice
        options: [prequeue, postflush, worker]
        default: worker

permissions:
  contents: read
  actions: read

concurrency:
  group: deferred-callsite-${{ github.ref }}
  cancel-in-progress: false

env:
  STAGE: ${{ inputs.stage || 'worker' }}

jobs:
  audit:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          clean: false
          persist-credentials: false
      - uses: docker://rhysd/actionlint:latest
        with:
          args: -color .github/workflows/thyme-slot-b-deferred-probe.yml
      - name: Fetch pinned source and audit tools
        run: |
          set -euo pipefail
          git config submodule.linux-6.6.url https://github.com/gregkh/linux.git
          git submodule update --init --depth 1 linux-6.6
          test "$(git -C linux-6.6 rev-parse HEAD)" = 8b73de7da85fde281a385e0b26eda9bffd3ca477
          for patch in patches/linux-6.6/*.patch; do git -C linux-6.6 apply "$GITHUB_WORKSPACE/$patch"; done
          sudo apt-get update
          sudo apt-get install -y clang-18 llvm-18
      - name: Source and negative fixtures
        run: python3 -B -m unittest discover -s scripts/slot_b -p 'test_deferred_probe_checkpoints.py' -v
      - name: Download immutable inputs and assemble the proven core
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          gh run download 35040148509 -R "$GITHUB_REPOSITORY" -n thyme-slot-b-kernel-audit-bundle -D bundle
          gh run download 34741153230 -R "$GITHUB_REPOSITORY" -n thyme-r3-p1b-fix8-fix24 -D frozen
          clang-18 --target=aarch64-linux-gnu -c scripts/slot_b/checkpoint-ultracompact.S -o core.o
          llvm-readelf-18 -r core.o | tee core-relocations.txt
          grep -q 'There are no relocations in this file' core-relocations.txt
          llvm-objcopy-18 -O binary --only-section=.text core.o core.bin
      - name: Audit only the selected new target and independently reverify
        run: |
          set -euo pipefail
          for stage in "$STAGE"; do
            python3 -u -B scripts/slot_b/deferred_probe_checkpoints.py \
              --stage "$stage" --bundle bundle --frozen frozen/thyme-r3-p1b-fix8-kernel-payload.bin \
              --core core.bin --out "$stage" | tee "$stage.log"
            python3 -u -B scripts/slot_b/deferred_probe_checkpoints.py \
              --stage "$stage" --bundle bundle --frozen frozen/thyme-r3-p1b-fix8-kernel-payload.bin \
              --core core.bin --out "$stage-reverify" --verify-pair "$stage/pair" | tee "$stage-reverify.log"
          done
      - uses: actions/upload-artifact@v4
        with:
          name: thyme-deferred-${{ env.STAGE }}-pair
          path: ${{ env.STAGE }}/pair/
          if-no-files-found: error
          retention-days: 90
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: thyme-deferred-audit
          path: |
            ${{ env.STAGE }}/audit.json
            ${{ env.STAGE }}/original-function.txt
            ${{ env.STAGE }}/verified.json
            *-reverify/verified.json
            *.log
            core-relocations.txt
          if-no-files-found: warn
          retention-days: 90
