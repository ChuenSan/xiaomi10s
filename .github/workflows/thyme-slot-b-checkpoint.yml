name: thyme-slot-b-checkpoint

on:
  push:
    branches: [route-b-slot-b-continuation]
    paths:
      - 'scripts/slot_b/checkpoint.py'
      - 'scripts/slot_b/test_checkpoint.py'
      - 'scripts/slot_b/reconcile_bundle.py'
      - '.github/workflows/thyme-slot-b-checkpoint.yml'
  workflow_dispatch:
    inputs:
      bundle_run_id:
        description: Reuse this audit kernel; no kernel rebuild
        required: false
        default: '35040148509'
      delay:
        description: Matched checkpoint delay in seconds
        type: choice
        options: ['1', '8']
        default: '1'

permissions:
  contents: read
  actions: read

jobs:
  source-tests:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          clean: false
          persist-credentials: false
      - run: python3 -B -m unittest discover -s scripts/slot_b -p 'test_*.py' -v

  checkpoint:
    if: github.event_name == 'workflow_dispatch'
    needs: source-tests
    runs-on: ubuntu-24.04
    timeout-minutes: 150
    steps:
      - uses: actions/checkout@v4
        with:
          clean: false
          persist-credentials: false
      - name: Install matching toolchain
        run: |
          sudo apt-get update
          sudo apt-get install -y clang-18 llvm-18 lld-18 make gcc bc bison flex libssl-dev libelf-dev gcc-aarch64-linux-gnu binutils-aarch64-linux-gnu
          clang-18 --version | grep -F '18.1.3'
          echo '/usr/lib/llvm-18/bin' >> "$GITHUB_PATH"
      - name: Download immutable inputs
        env:
          GH_TOKEN: ${{ github.token }}
          BUNDLE_RUN: ${{ inputs.bundle_run_id || '35040148509' }}
        run: |
          set -euo pipefail
          gh run download 34741153230 -R "$GITHUB_REPOSITORY" -n thyme-r3-p1b-fix8-fix24 -D frozen
          gh run download 34980859158 -R "$GITHUB_REPOSITORY" -n thyme-r3-p1b-reset-pair -D proven-core
          gh run download "$BUNDLE_RUN" -R "$GITHUB_REPOSITORY" -n thyme-slot-b-kernel-audit-bundle -D kernel-bundle
          if [ "$BUNDLE_RUN" = 35036419486 ]; then
            python3 -B scripts/slot_b/reconcile_bundle.py --input kernel-bundle --output reconciled-bundle
            echo 'BUNDLE_PATH=reconciled-bundle' >> "$GITHUB_ENV"
            echo 'BUNDLE_RECONCILED=true' >> "$GITHUB_ENV"
          else
            echo 'BUNDLE_PATH=kernel-bundle' >> "$GITHUB_ENV"
          fi
      - name: Preserve reconciled bundle with executable identity proof
        if: env.BUNDLE_RECONCILED == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: thyme-slot-b-kernel-audit-bundle
          path: reconciled-bundle/
          if-no-files-found: error
          compression-level: 1
          retention-days: 90
      - name: Reuse audit kernel and compose matched checkpoint
        env:
          DELAY: ${{ inputs.delay || '1' }}
        run: |
          set -euo pipefail
          python3 -u -B scripts/slot_b/checkpoint.py \
            --frozen frozen/thyme-r3-p1b-fix8-kernel-payload.bin \
            --core proven-core/p1b-t1-core-reference.bin \
            --bundle "$BUNDLE_PATH" --delay "$DELAY" \
            --out out-slot-b-checkpoint | tee checkpoint-build.log
      - name: Upload audited public payload (no OEM boot image)
        uses: actions/upload-artifact@v4
        with:
          name: thyme-slot-b-rest-init
          path: out-slot-b-checkpoint/checkpoint/
          if-no-files-found: error
      - name: Upload build log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: thyme-slot-b-checkpoint-log
          path: checkpoint-build.log
          if-no-files-found: warn
