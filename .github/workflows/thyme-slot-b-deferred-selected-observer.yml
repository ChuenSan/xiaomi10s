name: Slot B deferred selected-device observer gates

on:
  push:
    branches: [route-b-slot-b-continuation]
    paths:
      - 'scripts/slot_b/observe.py'
      - 'scripts/slot_b/deferred_selected_identities.json'
      - 'scripts/slot_b/test_deferred_selected_observer.py'
      - 'scripts/slot_b/deferred_selected_identity_agreement.py'
      - '.github/workflows/thyme-slot-b-deferred-selected-observer.yml'
  workflow_dispatch:

permissions:
  contents: read
  actions: read

jobs:
  observer-gates:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          clean: false
          persist-credentials: false
      - uses: docker://rhysd/actionlint:latest
        with:
          args: -color .github/workflows/thyme-slot-b-deferred-selected-observer.yml
      - name: Test exact identities, conservative verdicts and Slot A rejection
        run: |
          set -euo pipefail
          python3 -B -m unittest discover -s scripts/slot_b -p 'test_deferred_selected_observer.py' -v
          python3 -B -m unittest discover -s scripts/slot_b -p 'test_observe.py' -v
      - name: Reconcile observer identities with the successful public audit
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          source_run=$(jq -r .public_run scripts/slot_b/deferred_selected_identities.json)
          source_commit=$(jq -r .source_commit scripts/slot_b/deferred_selected_identities.json)
          [[ "$source_run" =~ ^[1-9][0-9]*$ ]]
          [[ "$source_commit" =~ ^[0-9a-f]{40}$ ]]
          gh api "repos/$GITHUB_REPOSITORY/actions/runs/$source_run" > public-run.json
          jq -e --arg sha "$source_commit" '.head_sha == $sha and .status == "completed" and .conclusion == "success" and .path == ".github/workflows/thyme-slot-b-deferred-selected.yml"' public-run.json
          git fetch --no-tags --depth=1 origin "$source_commit"
          git diff --exit-code "$source_commit" HEAD -- \
            scripts/slot_b/deferred_selected_probe.py scripts/slot_b/deferred_probe_checkpoints.py \
            scripts/slot_b/checkpoint.py scripts/r3-p1b patches/linux-6.6
          gh run download "$source_run" -R "$GITHUB_REPOSITORY" -n thyme-deferred-selected-pair -D pair
          python3 -B scripts/slot_b/deferred_selected_identity_agreement.py --root pair | tee observer-identity.txt
      - uses: actions/upload-artifact@v4
        with:
          name: thyme-deferred-selected-observer-gates
          path: |
            observer-identity.txt
            public-run.json
          if-no-files-found: error
          retention-days: 90
